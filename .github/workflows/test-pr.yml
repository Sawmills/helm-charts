name: Lint and test

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  helm-test-remote-operator-compat:
    name: Helm Chart Tests / Remote Operator Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 3.18.0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install render-test dependency
        run: python3 -m pip install PyYAML==6.0.3
      - name: Lint compatibility chart
        run: helm lint helm-charts/sawmills-remote-operator-compat
      - name: Compare against installed chart 2.0.5
        run: python3 helm-charts/sawmills-remote-operator-compat/tests/test_compatibility.py
      - name: Verify published package metadata
        run: python3 helm-charts/sawmills-remote-operator-compat/tests/test_publication.py
      - name: Compare against installed chart 2.0.23
        run: python3 helm-charts/sawmills-remote-operator-2023-compat/tests/test_compatibility_2023.py
      - name: Lint 2.0.23 compatibility chart
        run: helm lint helm-charts/sawmills-remote-operator-2023-compat

      - name: Compare against installed chart 2.0.18
        run: python3 helm-charts/sawmills-remote-operator-2018-compat/tests/test_compatibility_2018.py
      - name: Lint 2.0.18 compatibility chart
        run: helm lint helm-charts/sawmills-remote-operator-2018-compat

  check-codeowners:
    uses: ./.github/workflows/check-codeowners.yml

  helm-test-collector:
    name: Helm Chart Tests
    uses: ./.github/workflows/helm-test.yml

  helm-test-remote-operator:
    name: Helm Chart Tests / Remote Operator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 3.18.0

      - name: Run Helm lint
        run: helm lint helm-charts/sawmills-remote-operator

      - name: Run Helm template validation
        run: helm template test-release helm-charts/sawmills-remote-operator --values helm-charts/sawmills-remote-operator/values.yaml > /dev/null

      - name: Run Helm unit tests
        run: cd helm-charts/sawmills-remote-operator && ./tests/run-tests.sh

  helm-test-remote-operator-manual:
    name: Helm Chart Tests / Remote Operator Manual
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 3.18.0

      - name: Run Helm lint
        run: helm lint helm-charts/sawmills-remote-operator-manual --set apiKey=aaaa

      - name: Run Helm template validation
        run: helm template test-release helm-charts/sawmills-remote-operator-manual --values helm-charts/sawmills-remote-operator-manual/values.yaml --set apiKey=aaaa --set collectorName=sawmills-collector > /dev/null

      - name: Run Helm unit tests
        run: cd helm-charts/sawmills-remote-operator-manual && ./tests/run-tests.sh
