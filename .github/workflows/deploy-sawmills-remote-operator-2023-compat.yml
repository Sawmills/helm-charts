name: Deploy Sawmills Remote Operator 2.0.23 Compatibility Helm Chart

permissions:
  contents: read

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "helm-charts/sawmills-remote-operator-2023-compat/**"

jobs:
  version-and-tag:
    if: github.event.pull_request.merged == true
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-helm-chart.yml
    with:
      chart_path: helm-charts/sawmills-remote-operator-2023-compat
      chart_name: sawmills-remote-operator-2023-compat
      tag_prefix: remote-operator-2023-compat
      first_release_version: "1.0.0"
      version_has_quotes: true
    secrets: inherit

  build-and-deploy:
    if: github.event.pull_request.merged == true
    needs: [version-and-tag]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.version-and-tag.outputs.tag }}
          fetch-depth: 0
      - name: Publish compatibility chart
        uses: ./.github/actions/push-helm
        with:
          chart-path: helm-charts/sawmills-remote-operator-2023-compat
          chart-repo: public.ecr.aws/s7a5m1b4
          chart-name: sawmills-remote-operator-2023-compat-chart
          aws_region: ${{ vars.AWS_REGION }}
          aws_role: ${{ vars.AWS_ROLE }}
          ecr_account_id: ${{ vars.ECR_ACCOUNT_ID }}
          tag: ${{ needs.version-and-tag.outputs.tag }}
          app-version: "0.343.0"
          checkout-ref: ${{ needs.version-and-tag.outputs.tag }}
