name: push-helm
description: "Pushes Helm chart to Helm repository"
inputs:
  chart-path:
    description: "Path to the Helm chart"
    required: true
  chart-repo:
    description: "Helm repository name (the registry URL)"
    required: true
  chart-name:
    description: "Helm chart name"
    required: true
  tag:
    description: "Docker image tag"
    required: true
  aws_region:
    description: "AWS region"
    required: true
  aws_role:
    description: "AWS role"
    required: true
  ecr_account_id:
    description: "ECR account ID"
    required: true

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Authenticate with AWS
      uses: ./.github/actions/aws-auth
      with:
        aws_region: ${{ inputs.aws_region }}
        aws_role: ${{ inputs.aws_role }}
        ecr_account_id: ${{ inputs.ecr_account_id }}
    - name: Set up Helm
      shell: bash
      run: |
        curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        chmod 700 get_helm.sh
        ./get_helm.sh
    - name: Prepare Helm chart
      shell: bash
      env:
        CHART_NAME: ${{ inputs.chart-name }}
        CHART_PATH: ${{ inputs.chart-path }}
        CHART_REPO: ${{ inputs.chart-repo }}
        INPUT_TAG: ${{ inputs.tag }}
        AWS_REGION: ${{ inputs.aws_region }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        tag="$INPUT_TAG"
        echo "Input tag: $tag"

        # Extract version from tag (handles both "v1.2.3" and "prefix-v1.2.3" formats)
        if [[ $tag =~ -v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          # Format: prefix-v1.2.3 -> 1.2.3
          version="${BASH_REMATCH[1]}"
          appVersion="${BASH_REMATCH[1]}"
        elif [[ $tag =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          # Format: v1.2.3 -> 1.2.3
          version="${BASH_REMATCH[1]}"
          appVersion="${BASH_REMATCH[1]}"
        else
          # Fallback: use tag as-is
          version="$tag"
          appVersion="$tag"
        fi

        echo "Extracted version: $version"
        echo "App version: $appVersion"

        dst="$RUNNER_TEMP_DIR/charts"
        package="$RUNNER_TEMP_DIR/charts/$CHART_NAME"
        mkdir "$RUNNER_TEMP_DIR/charts"
        cp -r "$CHART_PATH" "$RUNNER_TEMP_DIR/charts"

        # in case the last part of the path of chart-path is not equal to chart-name rename to chart-name
        chart_path_basename=$(basename "$CHART_PATH")
        if [[ "$chart_path_basename" != "$CHART_NAME" ]]; then
          mv "$RUNNER_TEMP_DIR/charts/$chart_path_basename" "$RUNNER_TEMP_DIR/charts/$CHART_NAME"
        fi

        helm package "$package" \
          --version "$version" \
          --app-version "$appVersion" \
          --destination "$RUNNER_TEMP_DIR/charts"

        aws ecr-public get-login-password \
          --region "$AWS_REGION" | helm registry login \
          --username AWS \
          --password-stdin "$CHART_REPO"

        helm push "${package}-${version}.tgz" "oci://$CHART_REPO"
