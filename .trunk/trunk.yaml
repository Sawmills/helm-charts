# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.3
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.24.2
    - node@22.16.0
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: osv-scanner
      commands:
        - name: scan
          run: osv-scanner --lockfile=${target} --format json --config=.trunk/configs/osv-scanner.toml
  disabled:
    - vale
  enabled:
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - golangci-lint2@2.6.1
    - taplo@0.10.0
    - bandit@1.9.4
    - black@26.3.1
    - isort@8.0.1
    - ruff@0.15.12
    - buf-breaking@1.59.0
    - gitleaks@8.29.0
    - goimports@0.9.1
    - kube-linter@0.7.2
    - pre-commit-hooks@5.0.0
    - remark-lint@12.0.1
    - terrascan@1.19.1
    - gofmt@1.20.4
    - hadolint@2.14.0
    - actionlint@1.7.8
    - buf-format@1.59.0
    - buf-lint@1.59.0
    - checkov@3.2.526
    - gofumpt@0.7.0
    - golines@0.13.0
    - osv-scanner@2.2.4
    - yamllint@1.38.0
    - git-diff-check
    - markdownlint@0.48.0
    - prettier@3.8.3
    - trufflehog@3.90.13
    - semgrep@1.161.0
  ignore:
    - linters: [markdownlint]
      paths:
        - CLAUDE.md
    - linters: [prettier]
      paths:
        # Ignore markdown files
        - "**/*.md"
    - linters: [yamllint, prettier]
      paths:
        # Ignore helm charts directory
        - helm-charts/**
    - linters: [remark-lint, markdownlint]
      paths:
        # Ignore auto generate documentation.md file
        - "**/documentation.md"
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
  enabled:
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
