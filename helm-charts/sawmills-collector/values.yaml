# Number of replicas for the Sawmills collector
# Note: This setting is ignored when mode is set to "daemonSet"
replicaCount: 10

# Deployment mode for the collector
# Available modes:
# - deployment: Standard Kubernetes Deployment (default)
# - daemonSet: Runs on every node in the cluster (or every node matching nodeSelector)
# When using daemonSet mode:
# - replicaCount and autoscaling settings are ignored
# - Rolling update strategy is handled differently by Kubernetes
# - Useful for collecting metrics/logs from every node in the cluster
mode: deployment

# The name of the collector
collectorName: sawmills-collector
collectorId: sawmills-collector-id

# Optional runtime resource base name. Leave empty to keep using the Helm release name.
# Set this when embedding the chart in an umbrella/monochart release where the
# collector resources need their own stable Kubernetes base name.
# Must be a Kubernetes DNS label no longer than 32 characters so generated
# suffixed names such as <base>-load-balancer-telemetry-config remain valid.
# Changing this on an existing release changes rendered resource names.
# Adopt it with a fresh install or a planned rename migration.
resourceBaseName: ""

# Rollout configuration
rollout:
  # Global rollout settings
  terminationGracePeriodSeconds: 150
  minReadySeconds: 15

  # Deployment strategy configuration
  # For Deployment mode:
  # - RollingUpdate (default): Gradually replaces old pods with new ones
  # - Recreate: Deletes all existing pods before creating new ones
  # For DaemonSet mode:
  # - RollingUpdate (default): Gradually replaces old pods with new ones
  # - OnDelete: Only replaces pods when they are deleted
  #
  # BACKWARD COMPATIBLE: This chart supports both legacy and new formats
  # NEW FORMAT (recommended, aligns with upstream OpenTelemetry collector):
  # EXAMPLE:
  # For a conservative rolling update with minimal disruption:
  # rollout:
  #   strategy: RollingUpdate
  #   rollingUpdate:
  #     maxUnavailable: 1
  #     maxSurge: 1
  #   minReadySeconds: 30
  #
  # For a recreate strategy (all pods replaced at once):
  # rollout:
  #   strategy: Recreate
  #   terminationGracePeriodSeconds: 30
  strategy: RollingUpdate
  rollingUpdate:
    # Maximum number of pods that can be unavailable during the update
    # When unset, defaults to 1 for fleets ≤ 10 collectors and scales with replicaCount for larger fleets.
    maxUnavailable: null

    # Maximum number of pods that can be scheduled above the desired number of pods
    # When unset, defaults to 2 for fleets ≤ 10 collectors and scales with replicaCount for larger fleets.
    # Only applicable for Deployment mode, not for DaemonSet
    maxSurge: null

  # LEGACY FORMAT SUPPORT:
  # If you have existing configurations using this format, they will continue to work:
  # rollout:
  #   strategy:
  #     maxUnavailable: 33
  #     maxSurge: 50
  #
  # The chart will automatically detect the legacy format and apply the correct configuration.
  #
  # Migration guide:
  # 1. Change "strategy:" from a map to a string value (e.g., "RollingUpdate")
  # 2. Move maxUnavailable and maxSurge under "rollingUpdate:" section
  # 3. Add "%" suffix to percentage values if desired
  #

  # Main collector specific settings
  main:
    probes:
      liveness:
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 5
      readiness:
        initialDelaySeconds: 0
        periodSeconds: 5
      startup:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 12
    # Sleep-based fallback used when backend drain mode is disabled or the
    # deployment is not using the loadBalancer topology.
    preStopSleepSeconds: 15
    drain:
      # When loadBalancer.enabled=true, the chart adds a small backend_drain
      # overlay config by default and switches the main collector
      # readiness/preStop hooks to this dedicated endpoint.
      enabled: true
      # overlay preserves the legacy chart-rendered backend_drain config file.
      # mainConfig expects backend_drain to exist in the primary collector config
      # and is used by collectors-service for S3-backed rollout configs.
      configSource: overlay
      port: 13137
      readinessPath: /ready
      drainPath: /drain
      # Backend drain readiness proxies this health endpoint until drain starts.
      healthCheckEndpoint: http://${env:MY_POD_IP}:13133/healthcheck
      # Preserve the standard collector extensions when rendering the
      # backend_drain overlay, especially for S3-backed main configs where the
      # chart cannot inspect the remote file directly.
      serviceExtensions:
        - health_check
        - cgroup_runtime
      # Keep drain.duration + shutdownReserve below
      # rollout.terminationGracePeriodSeconds so the collector still has time
      # to handle SIGTERM after the drain hook returns.
      duration: 120s
      # Reserve explicit post-drain shutdown time inside the pod termination
      # grace period for collector shutdown and kubelet bookkeeping.
      shutdownReserve: 10s

  # Telemetry collector specific settings
  telemetry:
    probes:
      liveness:
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 5
      readiness:
        initialDelaySeconds: 5
        periodSeconds: 5

  # HAProxy specific settings
  haproxy:
    probes:
      liveness:
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 5
      readiness:
        initialDelaySeconds: 5
        periodSeconds: 5

  # LoadBalancer specific settings
  loadBalancer:
    probes:
      liveness:
        initialDelaySeconds: 5
        periodSeconds: 5
        failureThreshold: 5
      readiness:
        # initialDelaySeconds should exceed HAProxy rise time (rise * interval)
        # Default: rise=4, interval=2000ms = 8s, so 10s provides margin
        initialDelaySeconds: 10
        periodSeconds: 2
      startup:
        enabled: true
        initialDelaySeconds: 0
        periodSeconds: 5
        failureThreshold: 12
    preStopSleepSeconds: 20

# Pod disruption budget to keep collectors available during rollouts
podDisruptionBudget:
  enabled: true
  # Defaults based on replicaCount (replicaCount-1 when ≤ 5, otherwise ceil(0.8 * replicaCount)) when unset.
  minAvailable: null


# Configuration for the Sawmills collector
collectorConfig:
  # Runtime folder prefix injected as FOLDER_NAME for remote collector configs.
  folderName: ""
  # Runtime S3 bucket injected as S3_BUCKET for remote collector configs.
  s3Bucket: ""

# Configure the shared API secret used by the collector for authentication
# apiSecret:
#   name: sawmills-secret
#   key: api-key

prometheusremotewrite:
  endpoint: https://ingress.sawmills.ai
  external_labels:
    pod_name: ${env:MY_POD_NAME}
    collector_name: ${env:COLLECTOR_NAME}
    collector_id: ${env:COLLECTOR_ID}

collector_gateway:
  endpoint: https://ingress.sawmills.ai

# Configure outbound HTTP/HTTPS proxies for all traffic sent to Sawmills services.
# When set, the chart writes the values into HTTP_PROXY / HTTPS_PROXY / NO_PROXY env vars
# that the collector binary consumes automatically.
#
# NO_PROXY behavior:
# - When HTTP_PROXY or HTTPS_PROXY is set, NO_PROXY is automatically populated with:
#   * Mandatory values:
#     - static: localhost,127.0.0.1,::1,kubernetes,kubernetes.default.svc,.svc,.svc.cluster.local,.cluster.local
#     - dynamic: $(KUBERNETES_SERVICE_HOST),$(MY_POD_IP)
#   * User-defined values from noProxy (additive only)
# - Users cannot remove mandatory values, only add additional domains/IPs
proxy:
  http: ""
  https: ""
  # Optional: Additional domains/IPs to exclude from proxying (comma-separated string or array)
  noProxy: []

# AWS SDK configuration
aws:
  # Disable EC2 Instance Metadata Service (IMDS) credential lookups.
  # Set to true for IRSA (IAM Roles for Service Accounts) environments on EKS/Fargate
  # where IMDS is unavailable or not needed. This prevents IMDS timeout errors when
  # the collector starts before IRSA credentials are fully available.
  # Set to false if running on EC2 instances that rely on instance IAM roles via IMDS.
  disableIMDS: false

# extra environment variables for the collector
# for example:
# - name: DD_API_KEY
#   valueFrom:
#     secretKeyRef:
#       name: datadog
#       key: api-key
extraEnv: []
telemetryExtraEnv: []

# The image pull policy the Sawmills collector
image:
  repository: public.ecr.aws/s7a5m1b4/sawmills-collector
  pullPolicy: IfNotPresent
  tag: 1.1000.0
  # Optional image digest. When set, the chart renders repository@digest and ignores tag.
  digest: ""

# The node selector for the Sawmills collector
nodeSelector: {}

# Tolerations for the Sawmills collector pods
# Example:
# - key: "key1"
#   operator: "Equal"
#   value: "value1"
#   effect: "NoSchedule"
tolerations: []

# Pod annotations for the Sawmills collector
# These annotations will be added to the pod template metadata
# Example:
# podAnnotations:
#   foo: bar
#   prometheus.io/scrape: "true"
podAnnotations: {}

# Pod labels for the Sawmills collector
# These labels will be added to the pod template metadata
# Example:
# podLabels:
#   foo: bar
#   prometheus.io/scrape: "true"
podLabels: {}

# Node affinity / pod anti-affinity settings for the Sawmills collector pods.
# Disabled by default so the scheduler can bin-pack collector pods rather than
# spreading them (avoids fighting node consolidation, e.g. Karpenter).
# To spread pods across nodes for higher availability, replace the empty default
# below with a block such as:
#   podAntiAffinity:
#     preferredDuringSchedulingIgnoredDuringExecution:
#       - weight: 100
#         podAffinityTerm:
#           labelSelector:
#             matchExpressions:
#               - key: app.kubernetes.io/name
#                 operator: In
#                 values:
#                   - sawmills-collector-chart
#           topologyKey: kubernetes.io/hostname
# If resourceBaseName is set, use the selector label value rendered by
# sawmills-collector.selectorName. The chart's built-in default selector value
# (sawmills-collector-chart) is automatically rewritten to resourceBaseName;
# unrelated custom values are not.
affinity: {}

# Topology spread constraints for the Sawmills collector pods
# Example:
# topologySpreadConstraints:
#   - kubernetes.io/hostname
#   - topology.kubernetes.io/zone
topologySpreadConstraints: []

# The resources for the Sawmills collector
# To disable resource limits (no CPU/memory limits), set disableLimits: true:
# resources:
#   requests:
#     memory: 512Mi
#     cpu: 250m
#   disableLimits: true
resources:
  requests:
    memory: 512Mi
    cpu: 250m
  disableLimits: false
  limits:
    memory: 2.5Gi
    cpu: 3000m

# Priority class name for the collector pods.
# This determines the scheduling priority of the pods
# Useful for ensuring collector pods are scheduled before other pods
# Example: system-node-critical, system-cluster-critical
priorityClassName: ""

telemetry:
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    disableLimits: false
    limits:
      memory: 2.5Gi
      cpu: 3000m
  # Prometheus port for the telemetry collector, can be used by customers to scrape metrics
  prometheus:
    port: 19465
  # OTLP/HTTP ingest port on the telemetry collector for remote-operator metrics
  remoteOperatorOtlpHttpPort: 14319

# Standard Kubernetes HPA (autoscaling/v2)
autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 50
  # Optional absolute per-pod CPU target, e.g. 400m. When set, the HPA uses
  # Resource/AverageValue instead of CPU utilization, so scaling is not coupled
  # to low CPU requests.
  targetCPUAverageValue: ""
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80
  # Add behavior configuration for faster scaling
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120

# KEDA-based autoscaling (separate from standard HPA)
keda:
  enabled: false
  minReplicas: 2
  maxReplicas: 100
  pollingInterval: 30
  cooldownPeriod: 0
  # KEDA fallback keeps the target deployment above min replicas when scaler
  # metrics fail repeatedly.
  fallback:
    enabled: false
    failureThreshold: 3
    replicas: 10
  # Optional annotations for the KEDA ScaledObject.
  # For non-Helm-owned HPA -> KEDA ownership transfers, set:
  #   scaledobject.keda.sh/transfer-hpa-ownership: "true"
  annotations: {}
  # Advanced HPA configuration for KEDA (optional)
  # This block allows you to specify advanced HorizontalPodAutoscaler behavior,
  # such as custom scaleUp/scaleDown policies and stabilization windows.
  # See: https://keda.sh/docs/2.14/concepts/scaling-deployments/#advanced-horizontal-pod-autoscaler-configuration
  # Example:
  advanced:
    horizontalPodAutoscalerConfig:
      # Set this to an existing non-Helm-owned HPA name when using
      # scaledobject.keda.sh/transfer-hpa-ownership.
      name: ""
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Min
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
            - type: Pods
              value: 5
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
            - type: Pods
              value: 20
              periodSeconds: 60
  scaling:
    prometheus:
      enabled: false
      metricType: Value
      metadata:
        serverAddress: http://prometheus:9090
        query: sum(rate(http_requests_total{deployment="my-deployment"}[2m]))
        threshold: "100.50"
        activationThreshold: "5.5"
    external:
      enabled: false
      metricType: Value
      # LB trigger implementation. Defaults to external for backward compatibility.
      # Valid values: external, metrics-api.
      loadBalancerTriggerType: external
      loadBalancerMetricType: AverageValue
      metadata:
        scalerAddress: '{{ include "sawmills-collector.kedaScalerSvcFQDN" . }}:{{ .Values.kedaScaler.service.kedaExternalScalerPort }}'
        # Query by 99p latency of the 90p slowest pod
        query: >-
          quantile(0.9, (histogram_quantile(0.99, sum(rate(http_server_request_duration_bucket[10m])) by (le, method, instance)))) * 1000 > 6000
          or quantile(0.9, (histogram_quantile(0.99, sum(rate(http_server_request_duration_bucket[10m])) by (le, method, instance)))) * 1000 < 3500
          or vector(5000)
        targetValue: "5000"
      loadBalancerMetadata:
        scalerAddress: '{{ include "sawmills-collector.kedaScalerSvcFQDN" . }}:{{ .Values.kedaScaler.service.kedaExternalScalerPort }}'
        # Total queued LB batches. With loadBalancerMetricType AverageValue,
        # targetValue is queued batches per desired collector pod.
        # Tune as: per-pod LB batch drain rate * acceptable queue wait seconds.
        query: sum(otelcol_exporter_queue_size{exporter=~"loadbalancing/collector-loadbalancer.*"})
        targetValue: "300"
    cpu:
      enabled: true
      targetUtilization: 80
    memory:
      enabled: true
      targetUtilization: 80

# Ingress configuration
ingress:
  # Type of ingress to use (nginx or haproxy).
  type: nginx

  # Nginx ingress configuration
  nginx:
    enabled: false
    className: nginx
    port: 4318
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: sawmills-collector.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    # - secretName: collector-tls
    #   hosts:
    #     - sawmills-collector.local

  # HAProxy ingress configuration
  haproxy:
    enabled: false
    className: haproxy
    port: 4318
    annotations:
      kubernetes.io/ingress.class: haproxy
      haproxy.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: sawmills-collector.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
    # - secretName: collector-tls
    #   hosts:
    #     - sawmills-collector.local

service:
  type: ClusterIP
  headless:
    enabled: true
  # internalTrafficPolicy controls how traffic from within the cluster is routed
  # Available values: "Cluster" (default) or "Local"
  # When set to "Local", traffic from within the cluster is routed to endpoints on the same node
  internalTrafficPolicy: ""
  # Service annotations
  # Example:
  # annotations:
  #   service.kubernetes.io/topology-mode: "Auto"  # Enables automatic topology-aware routing
  #   custom.annotation: "value"
  annotations: {}

# Additional containers to be added to the pod
# This allows you to add sidecar containers to the collector pod.
# Each container follows the Kubernetes container spec format.
# For detailed examples, see the examples directory.
#
# Example:
# additionalContainers:
#   sidecar:
#     image: busybox:1.35
#     command: ['sh', '-c', 'echo Hello && sleep 3600']
#     resources:
#       requests:
#         memory: "64Mi"
#         cpu: "100m"
#       limits:
#         memory: "128Mi"
#         cpu: "200m"
additionalContainers: {}

# Additional volumes to be mounted by additional containers
# This allows you to add volumes that can be mounted by sidecar containers.
# For detailed examples, see the examples directory.
#
# Example:
# additionalVolumes:
#   - name: config-volume
#     configMap:
#       name: sidecar-config
additionalVolumes: []

# Additional volume mounts to be mounted by the main container.
# This allows you to specify where to mount volumes that can be mounted by the main container.
#
# Example:
# additionalVolumeMounts:
#   - name: config-volume
#     mountPath: /etc/config
additionalVolumeMounts: []

# Extra container ports. Each entry also creates a Service port.
# Do NOT add 13138 here — LiveTail control is Pod-IP-only (declared in deployment template).
ports: {}
# Example of adding a port
# grpc:
#   protocol: TCP
#   port: 4317
# http:
#   protocol: TCP
#   port: 4318
# datadoglog:
#   protocol: TCP
#   port: 10518

# Configuration for the OpenTelemetry Collector
# You can either use S3-based configuration or direct configuration, but not both.
# S3-based configuration
otelConfig:
  # The S3 path where the collector configuration is stored (e.g., s3://my-bucket/collector-config.yaml)
  s3path: ""
  # The encryption key used to decrypt the configuration file
  encryptionKey: ""

telemetryOtelConfig:
  s3path: ""
  encryptionKey: ""

# Direct configuration (used if otelConfig.s3path is not set)
otelCollectorConfig: {}
# Example configuration:
# receivers:
#   otlp:
#     protocols:
#       grpc:
#         endpoint: ${env:MY_POD_IP}:4317
# ... rest of the example configuration ...

# processors:
#   memory_limiter:
#     check_interval: 1s
#     limit_mib: 820
#     spike_limit_mib: 100

#   quotamgmtprocessor:
#     error_mode: ignore
#     s3_bucket: ${env:S3_BUCKET}
#     folder_name: ${env:FOLDER_NAME}
#     quota_refresh_duration: 60s
#     s3_region: us-east-1

#   throughputprocessor:
#     enabled: true
#     unique_label_value_count: 1000

#   batch:
#     send_batch_max_size: 1000
#     send_batch_size: 100
#     timeout: 10s

# exporters:
#   debug:
#     verbosity: basic

# extensions:
#   # The health_check extension is mandatory for this chart.
#   # Without the health_check extension the collector will fail the readiness and liveliness probes.
#   # The health_check extension can be modified, but should never be removed.
#   health_check:
#     endpoint: ${env:MY_POD_IP}:13133

#   cgroup_runtime:
#     gomaxprocs:
#       enabled: true
#     gomemlimit:
#       enabled: true
#       ratio: 0.8

# service:
#   extensions: [health_check, cgroup_runtime]
#   telemetry:
#     logs:
#       level: info
#       encoding: json
#     metrics:
#       readers:
#         - periodic:
#             interval: 50
#             timeout: 25
#             exporter:
#               otlp:
#                 protocol: grpc
#                 endpoint: 127.0.0.1:14317
#                 temporality_preference: delta
#                 compression: gzip

#   # Memlimit processor should be the first processor in the pipeline
#   # https://github.com/open-telemetry/opentelemetry-collector/tree/main/processor/memorylimiterprocessor#best-practices

#   pipelines:
#     logs:
#       receivers: [otlp, datadoglog]
#       processors: [memory_limiter, throughputprocessor, quotamgmtprocessor, batch]
#       exporters: [debug]
#     metrics:
#       receivers: [otlp]
#       processors: [memory_limiter, batch]
#       exporters: [debug]
#     traces:
#       receivers: [otlp]
#       processors: [memory_limiter, throughputprocessor, quotamgmtprocessor, batch]
#       exporters: [debug]

# HAProxy configuration
haproxy:
  enabled: false
  # HAProxy image used for the optional load-balancing sidecar.
  # Legacy full image strings are still accepted, e.g.
  # image: public.ecr.aws/docker/library/haproxy:3.1.15
  image:
    repository: public.ecr.aws/docker/library/haproxy
    tag: 3.1.15
    # Optional image digest. When set, the chart renders repository@digest and ignores tag.
    digest: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 99
    runAsGroup: 99
  max_connections: 60000
  # Probe configuration for HAProxy sidecar container.
  # type: "http" (default) or "tcp"
  probes:
    liveness:
      type: http
      port: 13135
      path: /healthcheck
    readiness:
      type: http
      port: 13135
      path: /ready
  # Number of consecutive layer 7 errors before marking backend DOWN and routing to fallback.
  # Higher values reduce fallback sensitivity to transient errors.
  # With Fix #1 (503 instead of 500), HAProxy retries on 503. error-limit counts only
  # consecutive non-retryable errors (5xx). 200 provides ~30s window at burst error rates
  # before mark-down, preventing cascade fallback during memory_limiter backpressure spikes.
  error_limit: 200

  # sawmills-collector: Fast fail behavior for local collector refusal spikes.
  # sawmills-collector: Keeps Kubernetes readiness/liveness unchanged; only affects HAProxy routing.
  refusal_fast_fail:
    # sawmills-collector: Enable explicit retry on HTTP 503 and use a lower error-limit for mark-down.
    # sawmills-collector: Useful when local collector starts refusing under pressure and traffic should move
    # sawmills-collector: to sibling/fallback paths faster.
    # sawmills-collector: retry-on-503 is only applied when sibling_fallback is enabled.
    enabled: false
    # sawmills-collector: Consecutive layer7 errors before marking local otel backend DOWN when enabled.
    # sawmills-collector: Smaller values fail over faster but may react to transient spikes.
    error_limit: 20
    # sawmills-collector: Ramp local backend traffic gradually after recovery to reduce re-overload.
    # sawmills-collector: Empty string disables slowstart.
    slowstart: ""

  # Native sidecar mode for HAProxy container lifecycle management.
  # Controls how HAProxy handles graceful shutdown during rolling updates.
  #   "false" (default) - Sleep-based preStop fallback. Works on all Kubernetes versions.
  #                        Uses 'sleep 3; kill -USR1 1' preStop on HAProxy and 'sleep 5' on main-collector.
  #   "true"            - Force Kubernetes native sidecar (init container with restartPolicy: Always).
  #                        Requires Kubernetes >= 1.29 with SidecarContainers feature gate enabled.
  #                        Guarantees shutdown ordering: main containers exit first, then sidecars.
  #   "auto"            - Auto-detect: uses native sidecar if cluster is Kubernetes >= 1.33
  #                        (where SidecarContainers is GA), falls back to sleep-based otherwise.
  nativeSidecar: "false"

  # Fallback server health check configuration
  # These settings control how HAProxy marks the backend as UP/DOWN
  fallback_config:
    server:
      # Number of successful health checks before marking server UP
      # 5 checks × 2s interval = 10s before re-enabling after recovery
      rise: 5
      # Health check interval in milliseconds
      interval: 2000
      # Number of failed health checks before marking server DOWN
      # 5 checks × 2s interval = 10s grace period before mark-down
      fall: 5

  # TLS configuration for HAProxy sidecar
  # When any port mapping has TLS enabled, this secret is mounted
  # 
  # Option 1: Reference an existing secret
  #   tls:
  #     secretName: "my-existing-tls-secret"
  #
  # Option 2: Provide certificate data directly (chart creates the secret)
  #   tls:
  #     certificate: "<base64-encoded-cert-and-chain>"
  #     privateKey: "<base64-encoded-private-key>"
  tls:
    # Name of an existing Kubernetes Secret containing tls.crt and tls.key
    # If certificate and privateKey are provided, this is ignored
    secretName: ""
    # Base64-encoded certificate (and chain). When provided with privateKey,
    # the chart creates a TLS secret automatically
    certificate: ""
    # Base64-encoded private key. When provided with certificate,
    # the chart creates a TLS secret automatically
    privateKey: ""
    # Path where TLS certificates are mounted inside the container
    certPath: "/etc/haproxy/certs"

  # Service configuration when TLS is enabled on any port
  service:
    # Service type when TLS is enabled (default: LoadBalancer)
    type: ""
    # Annotations for the service when TLS is enabled
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-internal: "true"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internal"

  resources:
    requests:
      memory: 128Mi
      cpu: 50m
    disableLimits: false
    limits:
      memory: 256Mi
      cpu: 100m
    # Set limits to null to disable resource limits
    # limits: null

  # Optional: Override global section
  global: {}
  # Example:
  #   log: "stdout format raw local0 info"
  #   maxconn: 4096
  #   nbthread: 4
  #   daemon: true

  # Optional: Override defaults section
  defaults: {}
  # Example:
  #   mode: "http"
  #   timeout:
  #     connect: "5s"
  #     client: "5s"
  #     server: "5s"
  #   retries: 3
  #   log: "global"
  #   options:
  #     - "redispatch"
  #     - "httplog"

  # Prometheus metrics configuration
  prometheus:
    enabled: true
    port: 8405 # Default prometheus port
    # Logging is always disabled for prometheus frontend

  # Stats page configuration
  stats:
    enabled: true
    port: 8406
    uri: "/"
    refresh: "10s"
    auth: "admin:admin"
    # Logging is always disabled for stats frontend

  # Healthcheck configuration
  healthcheck:
    enabled: true
    port: 13135
    # Optional readiness gate for LB pods. When enabled, the HAProxy readiness
    # frontend only returns healthy when the local collector's forwarding_health
    # extension reports usable downstream collector backends.
    forwarding_health:
      enabled: false
      port: 13136
      path: /forwarding-health
      interval: 3000
      rise: 2
      fall: 2

  # Sibling fallback configuration
  # When enabled, HAProxy routes to sibling LB pods (round-robin) before falling back
  # to the external vendor endpoint. This reduces unnecessary external egress during
  # single-pod failures or rolling updates.
  # Requires: loadBalancer.enabled=true, haproxy.enabled=true
  # Phase 1: HTTP and gRPC modes only (TCP deferred - header-based loop prevention not possible)
  sibling_fallback:
    # Enable sibling fallback tier (default: false - opt-in to preserve existing behavior)
    enabled: false
    # Maximum number of sibling server slots for HAProxy server-template
    # Should match or exceed loadBalancer.replicas / KEDA maxReplicas
    max_servers: 10
    # DNS resolver settings for headless service discovery
    resolver:
      hold_valid: "5s"
      hold_timeout: "5s"
      hold_refused: "5s"
    # Sibling health check configuration
    check:
      # Forwarding health endpoint port on sibling pods.
      # This endpoint should return 503 when local forwarding is unavailable
      # (for example: unresolvable backends / sustained downstream unavailability).
      # Default is 13136 to keep fallback decisions independent from Kubernetes probes.
      port: 13136
      # Check interval in milliseconds
      interval: 3000
      # Successful checks before marking sibling UP
      rise: 2
      # Failed checks before marking sibling DOWN
      fall: 2

  # External fallback controls whether HAProxy should use the configured
  # fallback_endpoint as last-resort vendor path.
  # Keep enabled=true by default for backward compatibility.
  external_fallback:
    enabled: true

  # Port mapping configuration
  # Each mapping can optionally enable TLS termination
  mapping: {}
    # Example:
    # http_4318:
    #   from: 4318
    #   to:
    #     port: 4318
    #     mode: "http"
    #     fallback_endpoint: datadoghq.com
    #   fallback_enabled: true
    #   logging: false
    #   options:
    #     - "httplog"
    #     - "dontlognull"
    #   backend_options:
    #     - "httpchk"
    #     - "allbackups"
    #   tls:                    # Optional: TLS termination for this port
    #     enabled: true         # Enable TLS on the same port (no separate TLS port)

haproxyConfig:
  receivers:
    # Scrape the haproxy sidecar so we can have these metrics
    prometheus/haproxy:
      config:
        scrape_configs:
          - job_name: haproxy
            scrape_interval: 15s
            static_configs:
              - targets: ["${env:MY_POD_IP}:8405"]
  service:
    pipelines:
      metrics/haproxy:
        receivers: [prometheus/haproxy]
        processors:
          - memory_limiter
          - batch
        exporters: [routing, forward]

telemetryExternalConfig:
  type: "prometheus"
  prometheusConfig:
    service:
      pipelines:
        metrics/external/prometheusremotewrite:
          receivers: [forward]
          processors: [transform/external_labels]
          exporters: [prometheusremotewrite]
  arrowConfig:
    service:
      pipelines:
        metrics/external/otelarrow:
          receivers: [forward]
          processors: [transform/external_labels]
          exporters: [otelarrow]

telemetryConfig:
  receivers:
    otlp/customer_collector:
      protocols:
        grpc:
          tls:
            cert_file: /etc/otel/certs/server-cert.pem
            key_file: /etc/otel/certs/server-key.pem
            ca_file: /etc/otel/certs/ca-cert.pem
          endpoint: 127.0.0.1:14317
          max_recv_msg_size_mib: 10
    otlp/telemetry_collector:
      protocols:
        grpc:
          tls:
            cert_file: /etc/otel/certs/server-cert.pem
            key_file: /etc/otel/certs/server-key.pem
            ca_file: /etc/otel/certs/ca-cert.pem
          endpoint: 127.0.0.1:14318
          max_recv_msg_size_mib: 10

  exporters:
    debug:
      # verbosity: detailed
      verbosity: basic
    prometheus:
      endpoint: ${env:MY_POD_IP}:${env:PROMETHEUS_PORT}
      metric_expiration: 1m
    otelarrow:
      endpoint: ${env:COLLECTOR_GATEWAY_ENDPOINT}
      timeout: 5m
      headers:
        Authorization: Bearer ${env:COLLECTOR_GATEWAY_API_KEY}
    prometheusremotewrite:
      endpoint: ${env:PROMETHEUS_REMOTE_WRITE_ENDPOINT}
      timeout: 10s
      headers:
        X-API-KEY: ${env:PROMETHEUS_REMOTE_WRITE_API_KEY}
      remote_write_queue:
        enabled: true
        queue_size: 2000
        num_consumers: 20
      retry_on_failure:
        enabled: true
        initial_interval: 2s
        max_interval: 5s
        max_elapsed_time: 5s
  processors:
    transform/external_labels:
      # This processor is dynamically generated by the template from prometheusremotewrite.external_labels
      # The template will override this configuration automatically
      error_mode: ignore
      metric_statements: []
    memory_limiter:
      check_interval: 1s
      limit_mib: 0
      limit_percentage: 95
      spike_limit_mib: 0
      spike_limit_percentage: 10

    batch:
      metadata_cardinality_limit: 0
      metadata_keys: []
      send_batch_max_size: 2048
      send_batch_size: 1024
      timeout: 1s

    transform/remove_unit:
      error_mode: ignore
      metric_statements:
        - context: metric
          statements:
            - set(metric.unit, "")
            - set(resource.attributes["service.name"], "otel-collector")

    transform/mark_as_telemetry:
      error_mode: ignore
      metric_statements:
        - context: metric
          statements:
            - set(resource.attributes["service.name"], "otel-collector-telemetry")
    deltatocumulative:
      max_stale: 1m

  extensions:
    cgroup_runtime:
      gomaxprocs:
        enabled: true
      gomemlimit:
        enabled: true
        ratio: 0.95
    health_check:
      # we're using port 13134 for healthcheck of the telemetry collector (vs 13133 for the main collector)
      endpoint: ${env:MY_POD_IP}:13134

  connectors:
    routing:
      error_mode: ignore
      table:
        # pass all metrics that are not related to thp or qmp to system pipeline
        - context: metric
          statement: route() where not IsMatch(name, "otelcol_processor_central_thp|otelcol_processor_thp|otelcol_processor_qmp")
          pipelines: [metrics/system]
    forward:

  service:
    extensions: [health_check, cgroup_runtime]
    pipelines:
      metrics/customer_collector:
        receivers: [otlp/customer_collector]
        processors:
          - memory_limiter
          - transform/remove_unit # TODO: This should be moved to the `metrics/system` pipeline once we start sending metrics with the new format
          - deltatocumulative # TODO: This will be moved to `metrics/system` once we start sending metrics with the new format
          - batch
        exporters: [routing, forward]

      metrics/telemetry_collector:
        receivers: [otlp/telemetry_collector]
        processors:
          - memory_limiter
          - transform/remove_unit
          - transform/mark_as_telemetry
          - deltatocumulative
          - batch
        exporters: [routing, forward]

      metrics/system:
        receivers: [routing]
        exporters: [prometheus]

    telemetry:
      resource:
        pod: ${env:MY_POD_NAME}
      logs:
        encoding: json
        error_output_paths:
          - stdout
        level: info
        output_paths:
          - stdout
      metrics:
        readers:
          - periodic:
              interval: 15000 # 15 seconds
              timeout: 30000 # 30 seconds
              exporter:
                otlp:
                  protocol: grpc
                  endpoint: 127.0.0.1:14318
                  certificate: /etc/otel/certs/ca-cert.pem
                  temporality_preference: delta
                  compression: gzip

serviceAccount:
  # -- Whether to create a service account for the Sawmills Collector deployment.
  create: false
  # -- Additional labels to add to the created service account.
  additionalLabels: {}
  # -- Annotations to add to the created service account.
  annotations: {}
  # -- The name of the existing service account to use when
  # serviceAccount.create is false.
  name: null

# ServiceMonitor configuration for Prometheus Operator
serviceMonitor:
  # Enable or disable ServiceMonitor resource creation
  enabled: false
  # Additional labels for the ServiceMonitor
  labels:
    release: prometheus
  # Metrics endpoints configuration
  metricsEndpoints:
    - port: prometheus
      interval: 15s

kedaScaler:
  enabled: false
  imagePullPolicy: Always
  podSecurityContext: {}
  probes:
    liveness:
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
      timeoutSeconds: 2
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 3
      timeoutSeconds: 1
  service:
    type: ClusterIP
    otlpReceiverPort: 4518
    kedaExternalScalerPort: 4418
    healthcheckPort: 13134
    monitoringPort: 19465
    otelPrometheusPort: 19876
  resources:
    limits:
      cpu: 2
      memory: 256Mi
    requests:
      cpu: 500m
      memory: 128Mi
  telemetryConfig:
    processors:
      filter/keda:
        error_mode: ignore
        metrics:
          metric:
            # Drop every metric that is not in the KEDA scaler store allowlist.
            - not IsMatch(name, "^(haproxy_server_http_responses_total|http\\.server\\.duration|otelcol_exporter_queue_size|otelcol_exporter_queue_capacity|otelcol_loadbalancer_central_queue_compressed_bytes|otelcol_loadbalancer_central_queue_compressed_capacity|otelcol_loadbalancer_central_queue_saturation|otelcol_loadbalancer_central_queue_oldest_item_age|http\\.server\\.request\\.duration)$")
    exporters:
      otlp/keda:
        endpoint: '{{ include "sawmills-collector.kedaScalerSvcFQDN" . }}:${env:KEDA_SCALER_OTLP_RECEIVER_PORT}'
        compression: "none"
        tls:
          insecure: true
    service:
      pipelines:
        metrics/keda:
          exporters:
            - otlp/keda
          processors:
            - filter/keda
          receivers:
            - forward
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: ${env:MY_POD_IP}:${env:OTLP_RECEIVER_PORT}
    exporters:
      kedascaler:
        engine_settings:
          timeout: 30s
          max_samples: 500000
          lookback_delta: 5m
          retention_duration: 10m
        monitoring_http:
          endpoint: ${env:MY_POD_IP}:${env:MONITORING_PORT}
        scaler_grpc:
          endpoint: ${env:MY_POD_IP}:${env:KEDA_EXTERNAL_SCALER_PORT}
          transport: tcp
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 0
        limit_percentage: 95
        spike_limit_mib: 0
        spike_limit_percentage: 10
      batch:
        metadata_cardinality_limit: 0
        metadata_keys: []
        send_batch_max_size: 2048
        send_batch_size: 1024
        timeout: 1s
    extensions:
      cgroup_runtime:
        gomaxprocs:
          enabled: true
        gomemlimit:
          enabled: true
          ratio: 0.95
      health_check:
        endpoint: ${env:MY_POD_IP}:${env:HEALTHCHECK_PORT}
    service:
      extensions:
        - health_check
        - cgroup_runtime
      pipelines:
        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - kedascaler
      telemetry:
        resource:
          pod: ${env:MY_POD_NAME}
        logs:
          encoding: json
          error_output_paths:
            - stdout
          level: info
          output_paths:
            - stdout
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: ${env:MY_POD_IP}
                    port: ${env:OTEL_PROMETHEUS_PORT}

loadBalancer:
  enabled: false
  replicas: 3
  minReadySeconds: 15
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  podAnnotations: {}
  # terminationGracePeriodSeconds: time K8s waits after SIGTERM before force-killing the pod.
  # The OTel Collector handles SIGTERM gracefully (receivers→processors→exporters drain in order),
  # and we pair that with rollout.loadBalancer.preStopSleepSeconds (default 20s sleep) so HAProxy/main-collector
  # have time to drain in-flight traffic before the 60s grace period expires.
  terminationGracePeriodSeconds: 60
  nodeSelector: {}
  tolerations: []
  # Pod anti-affinity for the LB pods. Disabled by default so the scheduler can
  # bin-pack LB pods rather than spreading them.
  # To spread LB pods across nodes for higher availability, replace the empty
  # default below with a block such as:
  #   podAntiAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         podAffinityTerm:
  #           labelSelector:
  #             matchExpressions:
  #               - key: app.kubernetes.io/name
  #                 operator: In
  #                 values:
  #                   - sawmills-collector-chart-lb
  #           topologyKey: kubernetes.io/hostname
  # If resourceBaseName is set, use the selector label value rendered by
  # sawmills-collector.loadBalancerSelectorName. The chart's built-in default
  # selector value (sawmills-collector-chart-lb) is automatically rewritten to
  # <resourceBaseName>-lb; unrelated custom values are not.
  affinity: {}
  priorityClassName: ""
  topologySpreadConstraints: []
  additionalContainers: {}
  otelConfig:
    s3path: ""
    encryptionKey: ""
  telemetryOtelConfig:
    s3path: ""
    encryptionKey: ""
  # Direct LB OTel config. Queue compression options are configured under
  # otelCollectorConfig.exporters.<loadbalancing-exporter>.sending_queue:
  #   payload_compression: snappy|zstd|none
  #   compress_in_memory: true|false
  #
  # In-memory queue compression example:
  # otelCollectorConfig:
  #   exporters:
  #     loadbalancing:
  #       sending_queue:
  #         enabled: true
  #         queue_size: 2000
  #         payload_compression: zstd
  #         compress_in_memory: true
  #
  # Persistent queue compression example (requires loadBalancer.storage.enabled=true):
  # otelCollectorConfig:
  #   extensions:
  #     file_storage/otc:
  #       directory: /data/storage/otc
  #   exporters:
  #     loadbalancing:
  #       sending_queue:
  #         enabled: true
  #         queue_size: 2000
  #         storage: file_storage/otc
  #         payload_compression: zstd
  #   service:
  #     extensions: [health_check, file_storage/otc]
  extraEnv: []
  ports: {}
  # Optional pressure-aware readiness for LB collector pods. When enabled, the
  # chart adds the existing Sawmills backend_drain extension to the LB config
  # and points the Kubernetes readiness probe at backend_drain /ready. Liveness
  # stays on the collector health_check endpoint.
  pressureReadiness:
    enabled: false
    port: 13137
    readinessPath: /ready
    drainPath: /drain
    drainDuration: 15s
    # Defaults to HAProxy /ready when HAProxy HTTP readiness is enabled,
    # otherwise to collector health_check.
    healthCheckEndpoint: ""
    metricsEndpoint: http://${env:MY_POD_IP}:19465/metrics
    queueSaturationFailThreshold: 0.85
    queueSaturationRecoverThreshold: 0.60
    inflightSaturationFailThreshold: 0.85
    inflightSaturationRecoverThreshold: 0.60
    memorySaturationFailThreshold: 0.85
    memorySaturationRecoverThreshold: 0.70
    capacityWarningThreshold: 0.60
    failChecks: 2
    recoverChecks: 3
    rejectedQuietDuration: 1m
    oldestItemAgeFailThreshold: 1m
    # When unset, derived from loadBalancer.resources.limits.memory. Set 0 to
    # disable memory pressure gating for limitless pods.
    memoryLimitBytes: null
    serviceExtensions:
      - health_check
      - cgroup_runtime
  # Pod disruption budget for LB pods. Enabled by default to prevent
  # simultaneous voluntary disruptions (node scale-down, upgrades)
  # from taking all LB pods offline at once.
  podDisruptionBudget:
    enabled: true
    # Defaults based on LB replicas when unset:
    #   1 replica  → 0 (avoids blocking voluntary disruptions like node drain)
    #   2-3 replicas → replicas - 1
    #   >3 replicas  → ceil(0.66 * replicas)
    # When loadBalancer.keda is enabled, set minAvailable explicitly —
    # the default is computed from loadBalancer.replicas which may exceed
    # the actual pod count after KEDA scales down.
    minAvailable: null
  resources:
    requests:
      memory: 128Mi
      cpu: 250m
    disableLimits: false
    limits:
      memory: 512Mi
      cpu: 500m
  additionalVolumes: []
  storage:
    # Required when using a persistent sending_queue (sending_queue.storage).
    # The chart mounts this PVC at /data for the load balancer collector.
    enabled: false
    size: 1Gi
    className: "standard"
  service:
    type: ClusterIP
    headless:
      enabled: true
    internalTrafficPolicy: ""
    annotations: {}
    ports: {}
  keda:
    enabled: false
    minReplicas: 2
    maxReplicas: 50
    pollingInterval: 30
    cooldownPeriod: 0
    advanced:
      horizontalPodAutoscalerConfig:
        behavior:
          scaleDown:
            policies:
              - periodSeconds: 300
                type: Pods
                value: 1
            stabilizationWindowSeconds: 0
    scaling:
      prometheus:
        enabled: false
        metricType: Value
        metadata:
          serverAddress: ""
          query: ""
          threshold: ""
      cpu:
        enabled: true
        targetUtilization: 80
      memory:
        enabled: true
        targetUtilization: 80
  # Standard Kubernetes HPA (mutually exclusive with keda)
  # NOTE: Setting both targetCPUUtilizationPercentage and targetMemoryUtilizationPercentage
  # to 0 omits spec.metrics; K8s then defaults to 80% avg CPU. Use autoscaling.enabled=false to disable HPA.
  autoscaling:
    enabled: false
    minReplicas: 3
    maxReplicas: 50
    # Optional absolute per-pod CPU target, e.g. 400m. When set, the HPA uses
    # Resource/AverageValue instead of CPU utilization, so scaling is not coupled
    # to low CPU requests.
    targetCPUAverageValue: ""
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 120
        policies:
          - type: Percent
            value: 50
            periodSeconds: 120
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 25
            periodSeconds: 120
