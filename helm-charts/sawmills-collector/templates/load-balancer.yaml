{{- if .Values.loadBalancer.enabled }}
{{- include "sawmills-collector.validateLoadBalancerQueueCompression" . }}
{{- $lbOtelConfig := default dict .Values.loadBalancer.otelConfig }}
{{- $lbOtelS3Path := default "" $lbOtelConfig.s3path }}
{{- $lbOtelEncryptionKey := default "" $lbOtelConfig.encryptionKey }}
{{- $lbTelemetryOtelConfig := default (dict) .Values.loadBalancer.telemetryOtelConfig }}
{{- $lbTelemetryOtelS3Path := default "" $lbTelemetryOtelConfig.s3path }}
{{- $lbTelemetryOtelEncryptionKey := default "" $lbTelemetryOtelConfig.encryptionKey }}
{{- include "sawmills-collector.validateTelemetryPprof" . }}
{{- $lbStartupProbe := .Values.rollout.loadBalancer.probes.startup | default dict }}
{{- $lbPressureReadiness := .Values.loadBalancer.pressureReadiness | default dict }}
{{- $lbPressureReadinessEnabled := and .Values.loadBalancer.enabled ($lbPressureReadiness.enabled | default false) }}
{{- $haproxyReadinessType := (dig "probes" "readiness" "type" "http" .Values.haproxy) | toString | lower }}
{{- $haproxyReadinessPath := dig "probes" "readiness" "path" "/ready" .Values.haproxy }}
{{- $haproxyReadinessPort := dig "probes" "readiness" "port" 13135 .Values.haproxy }}
{{- $lbAutoscalingEnabled := and .Values.loadBalancer.autoscaling (eq .Values.loadBalancer.autoscaling.enabled true) }}
{{- $lbKedaEnabled := and .Values.loadBalancer.keda (eq .Values.loadBalancer.keda.enabled true) }}
{{- if eq $haproxyReadinessType "tcp" }}
{{- $haproxyReadinessPort = (.Values.haproxy.healthcheck.port | default 13135) }}
{{- end }}
apiVersion: apps/v1
{{- if .Values.loadBalancer.storage.enabled }}
kind: StatefulSet
{{- else }}
kind: Deployment
{{- end }}
metadata:
  name: {{ include "sawmills-collector.fullname" . }}-lb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sawmills-collector.loadBalancerLabels" . | nindent 4 }}
spec:
  {{- if not (or $lbAutoscalingEnabled $lbKedaEnabled) }}
  replicas: {{ .Values.loadBalancer.replicas }}
  {{- end }}
  {{- $lbStrategy := default (dict) .Values.loadBalancer.strategy }}
  {{- $lbStrategyType := default "RollingUpdate" $lbStrategy.type }}
  {{- if .Values.loadBalancer.storage.enabled }}
  updateStrategy:
    type: {{ $lbStrategyType }}
    {{- if eq $lbStrategyType "RollingUpdate" }}
    rollingUpdate:
      {{- $ru := default (dict) $lbStrategy.rollingUpdate }}
      maxUnavailable: {{ default 1 $ru.maxUnavailable }}
    {{- end }}
  {{- else }}
  strategy:
    type: {{ $lbStrategyType }}
    {{- if eq $lbStrategyType "RollingUpdate" }}
    rollingUpdate:
      {{- $ru := default (dict) $lbStrategy.rollingUpdate }}
      maxUnavailable: {{ default 0 $ru.maxUnavailable }}
      maxSurge: {{ default 1 $ru.maxSurge }}
    {{- end }}
  {{- end }}
  minReadySeconds: {{ default 0 .Values.loadBalancer.minReadySeconds }}
  selector:
    matchLabels:
      {{- include "sawmills-collector.loadBalancerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.loadBalancer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sawmills-collector.loadBalancerLabels" . | nindent 8 }}
    spec:
      serviceAccountName:  {{ include "sawmills-collector.serviceAccountName" . }}
      {{- if .Values.loadBalancer.storage.enabled }}
      securityContext:
        fsGroup: 10001
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.loadBalancer.terminationGracePeriodSeconds }}
      {{- if not (empty .Values.loadBalancer.nodeSelector) }}
      nodeSelector:
        {{- toYaml .Values.loadBalancer.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if not (empty .Values.loadBalancer.tolerations) }}
      tolerations:
        {{- toYaml .Values.loadBalancer.tolerations | nindent 8 }}
      {{- end }}
      {{- if not (empty .Values.loadBalancer.affinity) }}
      affinity:
        {{- include "sawmills-collector.renderLoadBalancerAffinity" . | nindent 8 }}
      {{- end }}
      {{- if .Values.loadBalancer.priorityClassName }}
      priorityClassName: {{ .Values.loadBalancer.priorityClassName }}
      {{- end }}
      {{- if .Values.loadBalancer.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.loadBalancer.topologySpreadConstraints }}
        - maxSkew: 1
          topologyKey: {{ . }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "sawmills-collector.loadBalancerSelectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}

      {{- $useNativeSidecar := eq (include "sawmills-collector.useNativeSidecar" .) "true" }}

      {{- if and .Values.haproxy.enabled $useNativeSidecar }}
      initContainers:
        {{- include "sawmills-collector.haproxyContainer" (dict "root" . "nativeSidecar" true) | nindent 8 }}
      {{- end }}

      containers:
        {{- if .Values.loadBalancer.additionalContainers }}
        {{- range $name, $container := .Values.loadBalancer.additionalContainers }}
        - name: {{ $name }}
          {{- toYaml $container | nindent 10 }}
        {{- end }}
        {{- end }}
        {{- if and .Values.haproxy.enabled (not $useNativeSidecar) }}
        {{- include "sawmills-collector.haproxyContainer" (dict "root" . "nativeSidecar" false) | nindent 8 }}
        {{- end }}
        - name: main-collector
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: {{ include "sawmills-collector.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or $lbOtelS3Path $lbPressureReadinessEnabled }}
          args:
            {{- if $lbOtelS3Path }}
            - "--config={{ $lbOtelS3Path }}{{- if $lbOtelEncryptionKey }}@{{ $lbOtelEncryptionKey }}{{- end }}"
            {{- else }}
            - "--config=file:/etc/otel/config.yaml"
            {{- end }}
            {{- if $lbPressureReadinessEnabled }}
            - "--config=file:/etc/otel/load-balancer-readiness-config.yaml"
            {{- end }}
          {{- end }}
          env:
            {{- include "sawmills-collector.runtimeConfigEnv" . | nindent 12 }}
            {{- if $lbPressureReadinessEnabled }}
            - name: PRESSURE_PROMETHEUS_PORT
              value: {{ .Values.telemetry.pressurePrometheus.port | default 19466 | quote }}
            - name: PROMETHEUS_PORT
              value: {{ .Values.telemetry.prometheus.port | quote }}
            {{- end }}
            {{- if and (not .Values.loadBalancer.resources.disableLimits) .Values.loadBalancer.resources.limits .Values.loadBalancer.resources.limits.memory }}
            {{- $memLimit := .Values.loadBalancer.resources.limits.memory | toString }}
            - name: GOMEMLIMIT
              value: {{ include "sawmills-collector.goMemLimit" $memLimit | quote }}
            {{- end }}
            {{- $proxy := default dict .Values.proxy }}
            {{- with $proxy.http }}
            - name: HTTP_PROXY
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with $proxy.https }}
            - name: HTTPS_PROXY
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- $noProxy := include "sawmills-collector.noProxyValue" . }}
            {{- if or $proxy.http $proxy.https $noProxy }}
            - name: NO_PROXY
              {{- if $noProxy }}
              value: {{ printf "%s,$(MY_POD_IP)" $noProxy | quote }}
              {{- else }}
              value: "$(MY_POD_IP)"
              {{- end }}
            {{- end }}
            {{- if .Values.loadBalancer.extraEnv }}
            {{- toYaml .Values.loadBalancer.extraEnv | nindent 12 }}
            {{- end }}
          ports:
            {{- range $name, $config := .Values.loadBalancer.ports }}
            - name: {{ $name }}
              containerPort: {{ $config.port }}
              protocol: {{ $config.protocol }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 13133
            initialDelaySeconds: {{ .Values.rollout.loadBalancer.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.rollout.loadBalancer.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.rollout.loadBalancer.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              {{- if $lbPressureReadinessEnabled }}
              path: {{ default "/ready" $lbPressureReadiness.readinessPath }}
              port: {{ default 13137 $lbPressureReadiness.port }}
              {{- else if .Values.haproxy.enabled }}
              path: {{ $haproxyReadinessPath }}
              port: {{ $haproxyReadinessPort }}  # Route through HAProxy to ensure backend is UP before receiving traffic
              {{- else }}
              path: /healthcheck
              port: 13133
              {{- end }}
            initialDelaySeconds: {{ .Values.rollout.loadBalancer.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.rollout.loadBalancer.probes.readiness.periodSeconds }}
          {{- if ($lbStartupProbe.enabled | default false) }}
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 13133
            initialDelaySeconds: {{ default 0 $lbStartupProbe.initialDelaySeconds }}
            periodSeconds: {{ default 5 $lbStartupProbe.periodSeconds }}
            failureThreshold: {{ default 12 $lbStartupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.rollout.loadBalancer.preStopSleepSeconds }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sleep
                  - "{{ .Values.rollout.loadBalancer.preStopSleepSeconds }}"
          {{- end }}
          resources:
            {{- if .Values.loadBalancer.resources.requests }}
            requests:
              {{- toYaml .Values.loadBalancer.resources.requests | nindent 14 }}
            {{- end }}
            {{- if not .Values.loadBalancer.resources.disableLimits }}
            limits:
              {{- toYaml .Values.loadBalancer.resources.limits | nindent 14 }}
            {{- end }}
          volumeMounts:
          {{- if not $lbOtelS3Path }}
            - name: sawmills-collector-config-load-balancer
              mountPath: /etc/otel/config.yaml
              subPath: config.yaml
          {{- end }}
          {{- if $lbPressureReadinessEnabled }}
            - name: sawmills-load-balancer-readiness-config
              mountPath: /etc/otel/load-balancer-readiness-config.yaml
              subPath: load-balancer-readiness-config.yaml
          {{- end }}
            - name: tmp
              mountPath: /tmp
          {{- if .Values.loadBalancer.storage.enabled }}
            - name: {{ include "sawmills-collector.name" . }}-lb
              mountPath: /data
          {{- end }}
        - name: telemetry-collector
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: {{ include "sawmills-collector.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or $lbTelemetryOtelS3Path .Values.kedaScaler.enabled }}
          args:
            {{- if $lbTelemetryOtelS3Path }}
            - "--config={{ $lbTelemetryOtelS3Path }}{{- if $lbTelemetryOtelEncryptionKey }}@{{ $lbTelemetryOtelEncryptionKey }}{{- end }}"
            {{- else }}
            - "--config=file:/etc/otel/config.yaml"
            {{- end }}
            {{- if .Values.kedaScaler.enabled }}
            - "--config=file:/etc/otel/keda.yaml"
            {{- end }}
          {{- end }}
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- if .Values.kedaScaler.enabled }}
            - name: KEDA_SCALER_OTLP_RECEIVER_PORT
              value: {{ .Values.kedaScaler.service.otlpReceiverPort | quote }}
            - name: KEDA_SCALER_OTEL_PROMETHEUS_PORT
              value: {{ .Values.kedaScaler.service.otelPrometheusPort | quote }}
            {{- end }}
            - name: COLLECTOR_NAME
              value: {{ .Values.collectorName }}
            - name: COLLECTOR_ID
              value: {{ .Values.collectorId }}
            - name: PROMETHEUS_PORT
              value: {{ .Values.telemetry.prometheus.port | quote }}
            {{- if .Values.telemetry.pprof.enabled }}
            - name: TELEMETRY_PPROF_PORT
              value: {{ .Values.telemetry.pprof.port | default 1778 | quote }}
            {{- end }}
            {{- if $lbPressureReadinessEnabled }}
            - name: PRESSURE_PROMETHEUS_PORT
              value: {{ .Values.telemetry.pressurePrometheus.port | default 19466 | quote }}
            {{- end }}
            - name: PROMETHEUS_REMOTE_WRITE_ENDPOINT
              value: {{ .Values.prometheusremotewrite.endpoint }}
            - name: PROMETHEUS_REMOTE_WRITE_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "sawmills-collector.secretConfig" . | nindent 18 }}
            - name: COLLECTOR_GATEWAY_ENDPOINT
              value: {{ .Values.collector_gateway.endpoint }}
            - name: COLLECTOR_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "sawmills-collector.secretConfig" . | nindent 18 }}
            {{- $proxy := default dict .Values.proxy }}
            {{- with $proxy.http }}
            - name: HTTP_PROXY
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- with $proxy.https }}
            - name: HTTPS_PROXY
              value: {{ tpl . $ | quote }}
            {{- end }}
            {{- $noProxy := include "sawmills-collector.noProxyValue" . }}
            {{- if or $proxy.http $proxy.https $noProxy }}
            - name: NO_PROXY
              {{- if $noProxy }}
              value: {{ printf "%s,$(MY_POD_IP)" $noProxy | quote }}
              {{- else }}
              value: "$(MY_POD_IP)"
              {{- end }}
            {{- end }}
            {{- if .Values.telemetryExtraEnv }}
            {{- toYaml .Values.telemetryExtraEnv | nindent 12 }}
            {{- end }}
          ports:
            - name: prometheus
              containerPort: {{ .Values.telemetry.prometheus.port }}
              protocol: TCP
            {{- if .Values.telemetry.pprof.enabled }}
            - name: telemetry-pprof
              containerPort: {{ .Values.telemetry.pprof.port | default 1778 }}
              protocol: TCP
            {{- end }}
            {{- if $lbPressureReadinessEnabled }}
            - name: pressure-prom
              containerPort: {{ .Values.telemetry.pressurePrometheus.port | default 19466 }}
              protocol: TCP
            {{- end }}
            - name: ro-otlp-http
              containerPort: {{ .Values.telemetry.remoteOperatorOtlpHttpPort | default 14319 }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 13134
            initialDelaySeconds: {{ .Values.rollout.telemetry.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.rollout.telemetry.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.rollout.telemetry.probes.liveness.failureThreshold }}
          resources:
            {{- if .Values.telemetry.resources.requests }}
            requests:
              {{- toYaml .Values.telemetry.resources.requests | nindent 14 }}
            {{- end }}
            {{- if not .Values.telemetry.resources.disableLimits }}
            limits:
              {{- toYaml .Values.telemetry.resources.limits | nindent 14 }}
            {{- end }}
          volumeMounts:
            {{- if not $lbTelemetryOtelS3Path }}
            - name: sawmills-load-balancer-telemetry-config
              mountPath: /etc/otel/config.yaml
              subPath: telemetry-config.yaml
            {{- end }}
            {{- if .Values.kedaScaler.enabled }}
            - name: sawmills-telemetry-keda-config
              mountPath: /etc/otel/keda.yaml
              subPath: keda.yaml
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.haproxy.enabled }}
        - name: haproxy-config
          configMap:
            name: {{ include "sawmills-collector.fullname" . }}-haproxy-config
        {{- end }}
        {{- if eq (include "sawmills-collector.haproxyTlsEnabled" .) "true" }}
        - name: haproxy-tls-secret
          secret:
            secretName: {{ include "sawmills-collector.haproxyTlsSecretName" . }}
        {{- end }}
        {{- if not $lbOtelS3Path }}
        - name: sawmills-collector-config-load-balancer
          configMap:
            name: {{ include "sawmills-collector.fullname" . }}-load-balancer-config
            items:
              - key: config.yaml
                path: config.yaml
        {{- end }}
        {{- if $lbPressureReadinessEnabled }}
        - name: sawmills-load-balancer-readiness-config
          configMap:
            name: {{ include "sawmills-collector.fullname" . }}-load-balancer-readiness-config
            items:
              - key: config.yaml
                path: load-balancer-readiness-config.yaml
        {{- end }}
        {{- if not $lbTelemetryOtelS3Path }}
        - name: sawmills-load-balancer-telemetry-config
          configMap:
            name: {{ include "sawmills-collector.fullname" . }}-load-balancer-telemetry-config
            items:
              - key: telemetry-config.yaml
                path: telemetry-config.yaml
        {{- end }}
        {{- if .Values.kedaScaler.enabled }}
        - name: sawmills-telemetry-keda-config
          configMap:
            name: {{ include "sawmills-collector.fullname" . }}-telemetry-keda-config
            items:
              - key: keda.yaml
                path: keda.yaml
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- /* LB-specific additionalVolumes take precedence; global additionalVolumes used as fallback */ -}}
        {{- with .Values.loadBalancer.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        {{- with .Values.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
  {{- if .Values.loadBalancer.storage.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: {{ include "sawmills-collector.name" . }}-lb
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.loadBalancer.storage.size }}
        storageClassName: {{ .Values.loadBalancer.storage.className }}
  {{- end }}
{{- end }}
