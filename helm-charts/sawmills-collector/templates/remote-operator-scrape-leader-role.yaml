{{- if and .Values.remoteOperatorMetricsScrape.enabled .Values.remoteOperatorMetricsScrape.leaderElection.enabled }}
{{- $leaseNamespace := default .Release.Namespace .Values.remoteOperatorMetricsScrape.leaderElection.leaseNamespace -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sawmills-collector.fullname" . }}-remote-operator-scrape-leader
  namespace: {{ $leaseNamespace }}
  labels:
    {{- include "sawmills-collector.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
{{- end }}
