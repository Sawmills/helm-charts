{{- $mainDrain := .Values.rollout.main.drain | default dict }}
{{- $mainStartupProbe := .Values.rollout.main.probes.startup | default dict }}
{{- $mainCollectorDrainEnabled := and .Values.loadBalancer.enabled ($mainDrain.enabled | default false) }}
{{- $mainCollectorDrainConfigSource := default "overlay" $mainDrain.configSource }}
{{- if and $mainCollectorDrainEnabled (not (or (eq $mainCollectorDrainConfigSource "overlay") (eq $mainCollectorDrainConfigSource "mainConfig"))) }}
{{- fail (printf "rollout.main.drain.configSource must be one of: overlay, mainConfig (got %q)" $mainCollectorDrainConfigSource) }}
{{- end }}
{{- $mainCollectorDrainOverlayEnabled := and $mainCollectorDrainEnabled (eq $mainCollectorDrainConfigSource "overlay") }}
{{- $mainOtelConfig := default dict .Values.otelConfig }}
{{- $mainOtelS3Path := default "" $mainOtelConfig.s3path }}
{{- $mainOtelEncryptionKey := default "" $mainOtelConfig.encryptionKey }}
{{- $telemetryOtelConfig := default (dict) .Values.telemetryOtelConfig }}
{{- $telemetryOtelS3Path := default "" $telemetryOtelConfig.s3path }}
{{- $telemetryOtelEncryptionKey := default "" $telemetryOtelConfig.encryptionKey }}
{{- include "sawmills-collector.validateTelemetryPprof" . }}
{{- if $mainCollectorDrainEnabled }}
{{- $drainDuration := default "15s" $mainDrain.duration }}
{{- $shutdownReserve := default "10s" $mainDrain.shutdownReserve }}
{{- $drainDurationMs := include "sawmills-collector.durationToMilliseconds" $drainDuration | atoi }}
{{- $shutdownReserveMs := include "sawmills-collector.durationToMilliseconds" $shutdownReserve | atoi }}
{{- $terminationGracePeriodMs := mul (int .Values.rollout.terminationGracePeriodSeconds) 1000 }}
{{- if ge (add $drainDurationMs $shutdownReserveMs) $terminationGracePeriodMs }}
{{- fail (printf "rollout.main.drain.duration (%s) plus rollout.main.drain.shutdownReserve (%s) must be less than rollout.terminationGracePeriodSeconds (%ds)" $drainDuration $shutdownReserve (int .Values.rollout.terminationGracePeriodSeconds)) }}
{{- end }}
{{- end }}
{{- if eq .Values.mode "daemonSet" }}
apiVersion: apps/v1
kind: DaemonSet
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "sawmills-collector.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sawmills-collector.labels" . | nindent 4 }}
spec:
  {{- if eq .Values.mode "deployment" }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- $strategyType := .Values.rollout.strategy }}
    {{- if kindIs "map" .Values.rollout.strategy }}
    {{- $strategyType = "RollingUpdate" }}
    {{- end }}
    {{- if eq $strategyType "RollingUpdate" }}
    rollingUpdate:
      {{- if kindIs "map" .Values.rollout.strategy }}
      {{- /* Support legacy format */}}
      maxUnavailable: {{ .Values.rollout.strategy.maxUnavailable }}{{ if not (regexMatch "^[0-9]+$" (.Values.rollout.strategy.maxUnavailable | toString)) }}{{ else }}%{{ end }}
      maxSurge: {{ .Values.rollout.strategy.maxSurge }}{{ if not (regexMatch "^[0-9]+$" (.Values.rollout.strategy.maxSurge | toString)) }}{{ else }}%{{ end }}
      {{- else }}
        {{- $configured := default (dict) .Values.rollout.rollingUpdate }}
        {{- $maxUnavailable := include "sawmills-collector.defaultMaxUnavailable" . }}
        {{- if and (hasKey $configured "maxUnavailable") (not (kindIs "invalid" (index $configured "maxUnavailable"))) -}}
          {{- $maxUnavailable = $configured.maxUnavailable -}}
        {{- end }}
        {{- $maxSurge := include "sawmills-collector.defaultMaxSurge" . }}
        {{- if and (hasKey $configured "maxSurge") (not (kindIs "invalid" (index $configured "maxSurge"))) -}}
          {{- $maxSurge = $configured.maxSurge -}}
        {{- end }}
      maxUnavailable: {{ $maxUnavailable }}
      maxSurge: {{ $maxSurge }}
        {{- range $key, $value := $configured }}
          {{- if and (ne $key "maxUnavailable") (ne $key "maxSurge") }}
      {{ $key }}: {{ $value }}
          {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
    type: {{ $strategyType }}
  minReadySeconds: {{ .Values.rollout.minReadySeconds }}
  {{- end }}
  {{- if eq .Values.mode "daemonSet" }}
  updateStrategy:
    {{- $strategyType := .Values.rollout.strategy }}
    {{- if kindIs "map" .Values.rollout.strategy }}
    {{- $strategyType = "RollingUpdate" }}
    {{- end }}
    {{- if eq $strategyType "RollingUpdate" }}
    rollingUpdate:
      {{- if kindIs "map" .Values.rollout.strategy }}
      {{- /* Support legacy format */}}
      maxUnavailable: {{ .Values.rollout.strategy.maxUnavailable }}{{ if not (regexMatch "^[0-9]+$" (.Values.rollout.strategy.maxUnavailable | toString)) }}{{ else }}%{{ end }}
      {{- else }}
        {{- $configured := default (dict) .Values.rollout.rollingUpdate }}
        {{- $maxUnavailable := include "sawmills-collector.defaultMaxUnavailable" . }}
        {{- if and (hasKey $configured "maxUnavailable") (not (kindIs "invalid" (index $configured "maxUnavailable"))) -}}
          {{- $maxUnavailable = $configured.maxUnavailable -}}
        {{- end }}
      maxUnavailable: {{ $maxUnavailable }}
      {{- end }}
    {{- end }}
    type: {{ $strategyType }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "sawmills-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "sawmills-collector.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName:  {{ include "sawmills-collector.serviceAccountName" . }}

      terminationGracePeriodSeconds: {{ .Values.rollout.terminationGracePeriodSeconds }}
      {{- if not (empty .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if not (empty .Values.tolerations) }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      {{- if not (empty .Values.affinity) }}
      affinity:
        {{- include "sawmills-collector.renderCollectorAffinity" . | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.topologySpreadConstraints }}
        - maxSkew: 1
          topologyKey: {{ . }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "sawmills-collector.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      containers:
        {{- if .Values.additionalContainers }}
        {{- range $name, $container := .Values.additionalContainers }}
        - name: {{ $name }}
          {{- toYaml $container | nindent 10 }}
        {{- end }}
        {{- end }}
        {{- if and .Values.haproxy.enabled (not .Values.loadBalancer.enabled) }}
        {{- include "sawmills-collector.haproxyContainer" (dict "root" . "nativeSidecar" false) | nindent 8 }}
        {{- end }}
        - name: telemetry-collector
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: {{ include "sawmills-collector.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or $telemetryOtelS3Path .Values.kedaScaler.enabled }}
          args:
            {{- if $telemetryOtelS3Path }}
            - "--config={{ $telemetryOtelS3Path }}{{- if $telemetryOtelEncryptionKey }}@{{ $telemetryOtelEncryptionKey }}{{- end }}"
            {{- else }}
            - "--config=file:/etc/otel/config.yaml"
            {{- end }}
            {{- if .Values.kedaScaler.enabled }}
            - "--config=file:/etc/otel/keda.yaml"
            {{- end }}
          {{- end }}
          env:
            - name: MY_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            {{- if .Values.kedaScaler.enabled }}
            - name: KEDA_SCALER_OTLP_RECEIVER_PORT
              value: {{ .Values.kedaScaler.service.otlpReceiverPort | quote }}
            - name: KEDA_SCALER_OTEL_PROMETHEUS_PORT
              value: {{ .Values.kedaScaler.service.otelPrometheusPort | quote }}
            {{- end }}
            - name: COLLECTOR_NAME
              value: {{ .Values.collectorName }}
            - name: COLLECTOR_ID
              value: {{ .Values.collectorId }}
            - name: PROMETHEUS_PORT
              value: {{ .Values.telemetry.prometheus.port | quote }}
            {{- if .Values.telemetry.pprof.enabled }}
            - name: TELEMETRY_PPROF_PORT
              value: {{ .Values.telemetry.pprof.port | default 1778 | quote }}
            {{- end }}
            - name: PROMETHEUS_REMOTE_WRITE_ENDPOINT
              value: {{ .Values.prometheusremotewrite.endpoint }}
            - name: PROMETHEUS_REMOTE_WRITE_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "sawmills-collector.secretConfig" . | nindent 18 }}
            - name: COLLECTOR_GATEWAY_ENDPOINT
              value: {{ .Values.collector_gateway.endpoint }}
            - name: COLLECTOR_GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "sawmills-collector.secretConfig" . | nindent 18 }}
            {{- include "sawmills-collector.proxyEnv" . | nindent 12 }}
            {{- if .Values.telemetryExtraEnv }}
            {{- toYaml .Values.telemetryExtraEnv | nindent 12 }}
            {{- end }}
          ports:
            - name: prometheus
              containerPort: {{ .Values.telemetry.prometheus.port }}
              protocol: TCP
            {{- if .Values.telemetry.pprof.enabled }}
            - name: telemetry-pprof
              containerPort: {{ .Values.telemetry.pprof.port | default 1778 }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 13134
            initialDelaySeconds: {{ .Values.rollout.telemetry.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.rollout.telemetry.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.rollout.telemetry.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 13134
            initialDelaySeconds: {{ .Values.rollout.telemetry.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.rollout.telemetry.probes.readiness.periodSeconds }}
          {{- if .Values.rollout.telemetry.preStopSleepSeconds }}
          # Single-handler preStop: hold SIGTERM long enough for in-flight
          # telemetry pushes to 127.0.0.1:<main OTLP port> to drain before the
          # main-collector starts closing its receivers during scale-down /
          # rollout. Must stay <= rollout.terminationGracePeriodSeconds.
          # Mirrors rollout.main.preStopSleepSeconds. Exec-only (no httpGet) —
          # K8s rejects preStop blocks with more than one handler type.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sleep
                  - "{{ .Values.rollout.telemetry.preStopSleepSeconds }}"
          {{- end }}
          resources:
            {{- if .Values.telemetry.resources.requests }}
            requests:
              {{- toYaml .Values.telemetry.resources.requests | nindent 14 }}
            {{- end }}
            {{- if not .Values.telemetry.resources.disableLimits }}
            limits:
              {{- toYaml .Values.telemetry.resources.limits | nindent 14 }}
            {{- end }}
          volumeMounts:
            {{- if not $telemetryOtelS3Path }}
            - name: sawmills-telemetry-config
              mountPath: /etc/otel/config.yaml
              subPath: telemetry-config.yaml
            {{- end }}
            {{- if .Values.kedaScaler.enabled }}
            - name: sawmills-telemetry-keda-config
              mountPath: /etc/otel/keda.yaml
              subPath: keda.yaml
            {{- end }}
            - name: tmp
              mountPath: /tmp
        - name: main-collector
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: {{ include "sawmills-collector.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if or $mainOtelS3Path $mainCollectorDrainEnabled }}
          args:
            {{- if $mainOtelS3Path }}
            - "--config={{ $mainOtelS3Path }}{{- if $mainOtelEncryptionKey }}@{{ $mainOtelEncryptionKey }}{{- end }}"
            {{- else }}
            - "--config=file:/etc/otel/config.yaml"
            {{- end }}
            {{- if $mainCollectorDrainOverlayEnabled }}
            - "--config=file:/etc/otel/backend-drain-config.yaml"
            {{- end }}
          {{- end }}
          env:
            {{- include "sawmills-collector.runtimeConfigEnv" . | nindent 12 }}
            - name: AUTH_KEY
              valueFrom:
                secretKeyRef:
                  {{- include "sawmills-collector.secretConfig" . | nindent 18 }}
            {{- if and .Values.aws .Values.aws.disableIMDS }}
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
            {{- end }}
            {{- include "sawmills-collector.proxyEnv" . | nindent 12 }}
            {{- if .Values.extraEnv }}
            {{- toYaml .Values.extraEnv | nindent 12 }}
            {{- end }}
          ports:
            # Pod-IP-only LiveTail control surface (livetailcontrolextension).
            # Hardcoded — must NOT be added to .Values.ports (would leak via Service).
            - name: livetail-ctrl
              containerPort: 13138
              protocol: TCP
            {{- range $name, $config := .Values.ports }}
            - name: {{ $name }}
              containerPort: {{ $config.port }}
              protocol: {{ $config.protocol }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 13133
            initialDelaySeconds: {{ .Values.rollout.main.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.rollout.main.probes.liveness.periodSeconds }}
            failureThreshold: {{ .Values.rollout.main.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              {{- if $mainCollectorDrainEnabled }}
              path: {{ .Values.rollout.main.drain.readinessPath }}
              port: {{ .Values.rollout.main.drain.port }}
              {{- else }}
              path: /healthcheck
              port: 13133
              {{- end }}
            initialDelaySeconds: {{ .Values.rollout.main.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.rollout.main.probes.readiness.periodSeconds }}
          {{- if ($mainStartupProbe.enabled | default false) }}
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 13133
            initialDelaySeconds: {{ default 0 $mainStartupProbe.initialDelaySeconds }}
            periodSeconds: {{ default 5 $mainStartupProbe.periodSeconds }}
            failureThreshold: {{ default 12 $mainStartupProbe.failureThreshold }}
          {{- end }}
          {{- if $mainCollectorDrainEnabled }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - "wget -q -O /dev/null http://${MY_POD_IP}:{{ .Values.rollout.main.drain.port }}{{ .Values.rollout.main.drain.drainPath }} 2>/dev/null || true; /bin/sleep {{ .Values.rollout.main.preStopSleepSeconds }}"
          {{- else if .Values.rollout.main.preStopSleepSeconds }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sleep
                  - "{{ .Values.rollout.main.preStopSleepSeconds }}"
          {{- end }}
          resources:
            {{- if .Values.resources.requests }}
            requests:
              {{- toYaml .Values.resources.requests | nindent 14 }}
            {{- end }}
            {{- if not .Values.resources.disableLimits }}
            limits:
              {{- toYaml .Values.resources.limits | nindent 14 }}
            {{- end }}
          volumeMounts:
          {{- if not $mainOtelS3Path }}
            - name: sawmills-collector-config
              mountPath: /etc/otel/config.yaml
              subPath: config.yaml
          {{- end }}
          {{- if $mainCollectorDrainOverlayEnabled }}
            - name: sawmills-backend-drain-config
              mountPath: /etc/otel/backend-drain-config.yaml
              subPath: config.yaml
          {{- end }}
            - name: sawmills-livetail-config
              mountPath: /etc/livetail-config/
            - name: tmp
              mountPath: /tmp
            {{- with .Values.additionalVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- if and .Values.haproxy.enabled (not .Values.loadBalancer.enabled) }}
        - name: haproxy-config
          configMap:
            name: {{ include "sawmills-collector.fullname" . }}-haproxy-config
        {{- if eq (include "sawmills-collector.haproxyTlsEnabled" .) "true" }}
        - name: haproxy-tls-secret
          secret:
            secretName: {{ include "sawmills-collector.haproxyTlsSecretName" . }}
        {{- end }}
        {{- end }}
        {{- if not $mainOtelS3Path }}
        - name: sawmills-collector-config
          configMap:
            name: {{ include "sawmills-collector.fullname" . }}-config
            items:
              - key: config.yaml
                path: config.yaml
        {{- end }}
        {{- if $mainCollectorDrainOverlayEnabled }}
        - name: sawmills-backend-drain-config
          configMap:
            name: {{ include "sawmills-collector.backendDrainConfigName" . }}
            items:
              - key: config.yaml
                path: config.yaml
        {{- end }}
        {{- if not $telemetryOtelS3Path }}
        - name: sawmills-telemetry-config
          configMap:
            name: {{ include "sawmills-collector.fullname" . }}-telemetry-config
            items:
              - key: telemetry-config.yaml
                path: telemetry-config.yaml
        {{- end }}
        {{- if .Values.kedaScaler.enabled }}
        - name: sawmills-telemetry-keda-config
          configMap:
            name: {{ include "sawmills-collector.fullname" . }}-telemetry-keda-config
            items:
              - key: keda.yaml
                path: keda.yaml
        {{- end }}
        - name: sawmills-livetail-config
          configMap:
            name: {{ include "sawmills-collector.fullname" . }}-livetail-config
        - name: tmp
          emptyDir: {}
        {{- with .Values.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
