# KEDA ScaledObject for the load balancer deployment/statefulset
{{- if and .Values.loadBalancer.enabled .Values.loadBalancer.keda.enabled }}
{{- if and .Values.loadBalancer.keda.scaling.external.enabled (not .Values.kedaScaler.enabled) }}
{{- fail "kedaScaler.enabled must be true when loadBalancer.keda.scaling.external.enabled is true" }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sawmills-collector.loadBalancerKedaScaledObjectName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/revision: {{ .Release.Revision | quote }}
  labels:
    {{- include "sawmills-collector.loadBalancerLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ if .Values.loadBalancer.storage.enabled }}StatefulSet{{ else }}Deployment{{ end }}
    name: {{ include "sawmills-collector.fullname" . }}-lb
  minReplicaCount: {{ .Values.loadBalancer.keda.minReplicas }}
  maxReplicaCount: {{ .Values.loadBalancer.keda.maxReplicas }}
  pollingInterval: {{ .Values.loadBalancer.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.loadBalancer.keda.cooldownPeriod }}
  {{- with .Values.loadBalancer.keda.advanced }}
  advanced:
    {{- with .horizontalPodAutoscalerConfig }}
    horizontalPodAutoscalerConfig:
      {{- with .behavior }}
      behavior:
        {{ toYaml . | nindent 12 }}
      {{- end }}
    {{- end }}
  {{- end }}
  triggers:
    {{- if .Values.loadBalancer.keda.scaling.prometheus.enabled }}
    {{- $prometheusMetadata := .Values.loadBalancer.keda.scaling.prometheus.metadata }}
    - type: prometheus
      metricType: {{ .Values.loadBalancer.keda.scaling.prometheus.metricType }}
      metadata:
        serverAddress: {{ required "loadBalancer.keda.scaling.prometheus.metadata.serverAddress is required when loadBalancer.keda.scaling.prometheus.enabled is true" $prometheusMetadata.serverAddress | quote }}
        query: {{ required "loadBalancer.keda.scaling.prometheus.metadata.query is required when loadBalancer.keda.scaling.prometheus.enabled is true" $prometheusMetadata.query | quote }}
        threshold: {{ required "loadBalancer.keda.scaling.prometheus.metadata.threshold is required when loadBalancer.keda.scaling.prometheus.enabled is true" $prometheusMetadata.threshold | quote }}
        {{- range $key, $value := $prometheusMetadata }}
        {{- if and (not (has $key (list "serverAddress" "query" "threshold"))) (not (kindIs "invalid" $value)) (not (and (kindIs "string" $value) (eq $value ""))) }}
        {{- printf "%s: %s" $key ($value | quote) | nindent 8 }}
        {{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.loadBalancer.keda.scaling.external.enabled }}
    {{- $external := .Values.loadBalancer.keda.scaling.external }}
    {{- $externalMetadata := $external.metadata }}
    {{- $lbTriggerType := default "external" $external.loadBalancerTriggerType }}
    - type: {{ $lbTriggerType }}
      {{- if eq $lbTriggerType "metrics-api" }}
      {{- if ($external.useCachedMetrics | default false) }}
      useCachedMetrics: true
      {{- end }}
      metadata:
        url: {{ include "sawmills-collector.loadBalancerKedaMetricsAPIURL" (dict "root" . "query" $externalMetadata.query) | quote }}
        format: "json"
        valueLocation: "result"
        targetValue: {{ required "loadBalancer.keda.scaling.external.metadata.targetValue is required for metrics-api" $externalMetadata.targetValue | quote }}
      {{- else }}
      metricType: {{ $external.metricType }}
      metadata:
        scalerAddress: {{ required "loadBalancer.keda.scaling.external.metadata.scalerAddress is required when loadBalancer.keda.scaling.external.enabled is true" (tpl (toString $externalMetadata.scalerAddress) .) | quote }}
        query: {{ required "loadBalancer.keda.scaling.external.metadata.query is required when loadBalancer.keda.scaling.external.enabled is true" $externalMetadata.query | quote }}
        targetValue: {{ required "loadBalancer.keda.scaling.external.metadata.targetValue is required when loadBalancer.keda.scaling.external.enabled is true" $externalMetadata.targetValue | quote }}
        {{- range $key, $value := $externalMetadata }}
        {{- if and (not (has $key (list "scalerAddress" "query" "targetValue"))) (not (kindIs "invalid" $value)) (not (and (kindIs "string" $value) (eq $value ""))) }}
        {{- printf "%s: %s" $key ($value | quote) | nindent 8 }}
        {{- end }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if .Values.loadBalancer.keda.scaling.cpu.enabled }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.loadBalancer.keda.scaling.cpu.targetUtilization | quote }}
    {{- end }}
    {{- if .Values.loadBalancer.keda.scaling.memory.enabled }}
    - type: memory
      metricType: Utilization
      metadata:
        value: {{ .Values.loadBalancer.keda.scaling.memory.targetUtilization | quote }}
    {{- end }}
{{- end }}
