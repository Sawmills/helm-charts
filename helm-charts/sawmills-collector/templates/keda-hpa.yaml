# KEDA HPA logic using the top-level 'keda' section 
{{- if .Values.keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "sawmills-collector.fullname" . }}-keda-hpa
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/revision: {{ .Release.Revision | quote }}
    {{- with .Values.keda.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- include "sawmills-collector.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "sawmills-collector.fullname" . }}
  minReplicaCount: {{ .Values.keda.minReplicas }}
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.keda.cooldownPeriod }}
  {{- if and .Values.keda.fallback .Values.keda.fallback.enabled }}
  fallback:
    failureThreshold: {{ .Values.keda.fallback.failureThreshold }}
    replicas: {{ .Values.keda.fallback.replicas }}
  {{- end }}
  {{- with .Values.keda.advanced }}
  advanced:
    {{- with .horizontalPodAutoscalerConfig }}
    horizontalPodAutoscalerConfig:
      {{- with .name }}
      name: {{ . | quote }}
      {{- end }}
      {{- with .behavior }}
      behavior:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
  triggers:
    {{- if .Values.keda.scaling.prometheus.enabled }}
    - type: prometheus
      metricType: {{ .Values.keda.scaling.prometheus.metricType }}
      metadata:
        {{- range $key, $value := .Values.keda.scaling.prometheus.metadata }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
    {{- end }}
    {{- if .Values.keda.scaling.external.enabled }}
    {{- $lbTriggerType := default "external" .Values.keda.scaling.external.loadBalancerTriggerType }}
    - type: {{ if .Values.loadBalancer.enabled }}{{ $lbTriggerType }}{{ else }}external{{ end }}
      {{- if .Values.loadBalancer.enabled }}
      metricType: {{ .Values.keda.scaling.external.loadBalancerMetricType | default .Values.keda.scaling.external.metricType }}
      {{- else }}
      metricType: {{ .Values.keda.scaling.external.metricType }}
      {{- end }}
      metadata:
        {{- if and .Values.loadBalancer.enabled (eq $lbTriggerType "metrics-api") }}
        url: {{ include "sawmills-collector.kedaMetricsAPIURL" (dict "root" . "query" .Values.keda.scaling.external.loadBalancerMetadata.query) | quote }}
        format: "json"
        valueLocation: "result"
        targetValue: {{ required "keda.scaling.external.loadBalancerMetadata.targetValue is required for metrics-api" .Values.keda.scaling.external.loadBalancerMetadata.targetValue | quote }}
        {{- else if .Values.loadBalancer.enabled }}
        {{- range $key, $value := .Values.keda.scaling.external.loadBalancerMetadata }}
        {{- if eq $key "scalerAddress" }}
        {{ $key }}: {{ tpl (toString $value) $ | quote }}
        {{- else }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- else}}
        {{- range $key, $value := .Values.keda.scaling.external.metadata }}
        {{- if eq $key "scalerAddress" }}
        {{ $key }}: {{ tpl (toString $value) $ | quote }}
        {{- else }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
    {{- end }}
    {{- if .Values.keda.scaling.cpu.enabled }}
    - type: cpu
      metricType: Utilization
      metadata:
        value: {{ .Values.keda.scaling.cpu.targetUtilization | quote }}
    {{- end }}
    {{- if .Values.keda.scaling.memory.enabled }}
    - type: memory
      metricType: Utilization
      metadata:
        value: {{ .Values.keda.scaling.memory.targetUtilization | quote }}
    {{- end }}
{{- end }}
