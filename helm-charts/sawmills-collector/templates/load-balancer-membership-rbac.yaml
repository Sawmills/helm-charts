{{- $membershipDiscovery := .Values.loadBalancer.membershipDiscovery | default dict }}
{{- if and .Values.loadBalancer.enabled $membershipDiscovery.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "sawmills-collector.fullname" . }}-lb-membership
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sawmills-collector.loadBalancerLabels" . | nindent 4 }}
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sawmills-collector.fullname" . }}-lb-membership
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sawmills-collector.loadBalancerLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sawmills-collector.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sawmills-collector.fullname" . }}-lb-membership
{{- end }}
