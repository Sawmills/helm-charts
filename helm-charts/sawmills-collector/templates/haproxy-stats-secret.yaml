{{- if and .Values.haproxy.enabled .Values.haproxy.stats.enabled (not .Values.haproxy.stats.auth) (not .Values.haproxy.stats.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sawmills-collector.haproxyStatsSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sawmills-collector.labels" . | nindent 4 }}
type: Opaque
data:
  auth: {{ include "sawmills-collector.haproxyStatsAuth" . | quote }}
{{- end }}
