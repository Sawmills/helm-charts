{{- if .Values.loadBalancer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "sawmills-collector.fullname" . }}
  labels:
    {{- include "sawmills-collector.loadBalancerLabels" . | nindent 4 }}
  {{- if .Values.loadBalancer.service.annotations }}
  annotations:
    {{- toYaml .Values.loadBalancer.service.annotations | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.loadBalancer.service.type }}
  {{- if .Values.loadBalancer.service.internalTrafficPolicy }}
  internalTrafficPolicy: {{ .Values.loadBalancer.service.internalTrafficPolicy }}
  {{- end }}
  ports:
    - protocol: TCP
      port: {{ .Values.telemetry.prometheus.port }}
      targetPort: {{ .Values.telemetry.prometheus.port }}
      name: prometheus
    - protocol: TCP
      port: {{ .Values.telemetry.remoteOperatorOtlpHttpPort | default 14319 }}
      targetPort: {{ .Values.telemetry.remoteOperatorOtlpHttpPort | default 14319 }}
      name: ro-otlp-http
    {{- range $name, $config := .Values.loadBalancer.service.ports }}
    - protocol: {{ $config.to.protocol }}
      port: {{ $config.to.port }}
      targetPort: {{ $config.from }}
      name: {{ $name }}
    {{- end }}
    {{- /* Client-facing HAProxy ports: <collector-id>.collectors.sawmills.ai resolves
    to this Service's ClusterIP, so every haproxy.mapping frontend must be exposed here. */}}
    {{- if .Values.haproxy.enabled }}
    {{- $usedServicePorts := list (int .Values.telemetry.prometheus.port) (int (.Values.telemetry.remoteOperatorOtlpHttpPort | default 14319)) }}
    {{- range $name, $config := .Values.loadBalancer.service.ports }}
    {{- $usedServicePorts = append $usedServicePorts (int $config.to.port) }}
    {{- end }}
    {{- range $name, $config := .Values.haproxy.mapping }}
    {{- if has (int $config.from) $usedServicePorts }}
    {{- fail (printf "haproxy.mapping.%s.from port %d conflicts with an existing load balancer Service port" $name (int $config.from)) }}
    {{- end }}
    - protocol: TCP
      port: {{ $config.from }}
      targetPort: {{ $config.from }}
      name: {{ printf "hp-%d" (int $config.from) }}
    {{- end }}
    {{- end }}
  selector:
    {{- include "sawmills-collector.loadBalancerSelectorLabels" . | nindent 4 }}
{{- end }}