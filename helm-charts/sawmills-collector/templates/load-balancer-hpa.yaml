{{- if and .Values.loadBalancer.enabled .Values.loadBalancer.autoscaling (eq .Values.loadBalancer.autoscaling.enabled true) (not (and .Values.loadBalancer.keda (eq .Values.loadBalancer.keda.enabled true))) }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "sawmills-collector.fullname" . }}-lb
  labels:
    {{- include "sawmills-collector.loadBalancerLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    {{- if and .Values.loadBalancer.storage (eq .Values.loadBalancer.storage.enabled true) }}
    kind: StatefulSet
    {{- else }}
    kind: Deployment
    {{- end }}
    name: {{ include "sawmills-collector.fullname" . }}-lb
  minReplicas: {{ .Values.loadBalancer.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.loadBalancer.autoscaling.maxReplicas }}
  {{- if or .Values.loadBalancer.autoscaling.targetCPUAverageValue .Values.loadBalancer.autoscaling.targetCPUUtilizationPercentage .Values.loadBalancer.autoscaling.targetMemoryAverageValue .Values.loadBalancer.autoscaling.targetMemoryUtilizationPercentage }}
  metrics:
  {{- if .Values.loadBalancer.autoscaling.targetCPUAverageValue }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: AverageValue
          averageValue: {{ .Values.loadBalancer.autoscaling.targetCPUAverageValue }}
  {{- else if .Values.loadBalancer.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.loadBalancer.autoscaling.targetCPUUtilizationPercentage }}
  {{- end }}
  {{- if .Values.loadBalancer.autoscaling.targetMemoryAverageValue }}
    - type: Resource
      resource:
        name: memory
        target:
          type: AverageValue
          averageValue: {{ .Values.loadBalancer.autoscaling.targetMemoryAverageValue }}
  {{- else if .Values.loadBalancer.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.loadBalancer.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
  {{- end }}
  {{- $behavior := deepCopy (.Values.loadBalancer.autoscaling.behavior | default dict) }}
  {{- $protection := .Values.loadBalancer.removalProtection | default dict }}
  {{- if $protection.disableScaleDown }}
  {{- $scaleDown := deepCopy ($behavior.scaleDown | default dict) }}
  {{- $_ := set $scaleDown "selectPolicy" "Disabled" }}
  {{- $_ := set $behavior "scaleDown" $scaleDown }}
  {{- end }}
  {{- with $behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
