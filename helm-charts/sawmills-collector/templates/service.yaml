{{- $haproxyTlsEnabled := eq (include "sawmills-collector.haproxyTlsEnabled" .) "true" -}}
{{- $annotations := dict -}}
{{- if .Values.service.annotations -}}
{{- $annotations = merge $annotations .Values.service.annotations -}}
{{- end -}}
{{- if and $haproxyTlsEnabled .Values.haproxy.service.annotations -}}
{{- $annotations = merge $annotations .Values.haproxy.service.annotations -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  {{- if .Values.loadBalancer.enabled }}
  name: {{ include "sawmills-collector.fullname" . }}-backend
  {{- else }}
  name: {{ include "sawmills-collector.fullname" . }}
  {{- end }}
  labels:
    {{- include "sawmills-collector.labels" . | nindent 4 }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if $haproxyTlsEnabled }}
  type: {{ .Values.haproxy.service.type | default "LoadBalancer" }}
  {{- else }}
  type: {{ .Values.service.type }}
  {{- end }}
  {{- if .Values.service.internalTrafficPolicy }}
  internalTrafficPolicy: {{ .Values.service.internalTrafficPolicy }}
  {{- end }}
  ports:
    - protocol: TCP
      port: {{ .Values.telemetry.prometheus.port }}
      targetPort: {{ .Values.telemetry.prometheus.port }}
      name: prometheus
    {{- range $name, $config := .Values.service.ports }}
    - protocol: {{ $config.to.protocol }}
      port: {{ $config.to.port }}
      targetPort: {{ $config.from }}
      name: {{ $name }}
    {{- end }}
  selector:
    {{- include "sawmills-collector.selectorLabels" . | nindent 4 }}
