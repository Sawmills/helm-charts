{{- if and .Values.haproxy.enabled (eq (include "sawmills-collector.haproxyTlsEnabled" .) "true") }}
{{- if and .Values.haproxy.tls .Values.haproxy.tls.certificate .Values.haproxy.tls.privateKey }}
# TLS Secret created from certificate data provided in values
# This secret is used by HAProxy for TLS termination
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sawmills-collector.fullname" . }}-haproxy-tls
  labels:
    {{- include "sawmills-collector.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  # Certificate (and chain if provided) - must be base64 encoded in values
  tls.crt: {{ .Values.haproxy.tls.certificate }}
  # Private key - must be base64 encoded in values
  tls.key: {{ .Values.haproxy.tls.privateKey }}
{{- end }}
{{- end }}
