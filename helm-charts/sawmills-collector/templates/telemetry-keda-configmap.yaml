{{- if .Values.kedaScaler.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sawmills-collector.fullname" . }}-telemetry-keda-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sawmills-collector.labels" . | nindent 4 }}
data:
  keda.yaml: |
    {{- with .Values.kedaScaler.telemetryConfig }}
      {{- $config := deepCopy . }}
      {{- with $config.exporters }}
        {{- with (index . "otlp/keda") }}
          {{- with .endpoint }}
            {{- $_ := set (index $config.exporters "otlp/keda") "endpoint" (tpl (toString .) $) }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- toYaml $config | nindent 4 }}
    {{- end }}
{{- end }}
