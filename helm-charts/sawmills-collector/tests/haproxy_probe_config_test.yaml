suite: test haproxy probe configuration
templates:
  - deployment.yaml
  - load-balancer.yaml
tests:
  - it: should default to http healthcheck probes for haproxy in deployment mode
    template: deployment.yaml
    values:
      - ../values.yaml
    set:
      haproxy.enabled: true
      haproxy.mapping.http_4318.from: 4318
      haproxy.mapping.http_4318.to.port: 4318
      haproxy.mapping.http_4318.to.protocol: "TCP"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 13135
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthcheck
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 13135
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthcheck

  - it: should pin haproxy to numeric non-root user in deployment mode
    template: deployment.yaml
    values:
      - ../values.yaml
    set:
      haproxy.enabled: true
      haproxy.mapping.http_4318.from: 4318
      haproxy.mapping.http_4318.to.port: 4318
      haproxy.mapping.http_4318.to.protocol: "TCP"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: haproxy
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 99
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 99

  - it: should allow overriding haproxy security context for custom images
    template: deployment.yaml
    values:
      - ../values.yaml
    set:
      haproxy.enabled: true
      haproxy.mapping.http_4318.from: 4318
      haproxy.mapping.http_4318.to.port: 4318
      haproxy.mapping.http_4318.to.protocol: "TCP"
      haproxy.securityContext.runAsUser: 1234
      haproxy.securityContext.runAsGroup: 1234
      haproxy.securityContext.allowPrivilegeEscalation: false
      haproxy.securityContext.readOnlyRootFilesystem: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: haproxy
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1234
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 1234
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: should render tcp probes for haproxy in deployment mode when configured
    template: deployment.yaml
    values:
      - ../values.yaml
    set:
      haproxy.enabled: true
      haproxy.mapping.http_4318.from: 4318
      haproxy.mapping.http_4318.to.port: 4318
      haproxy.mapping.http_4318.to.protocol: "TCP"
      haproxy.probes.liveness.type: tcp
      haproxy.probes.liveness.port: 10000
      haproxy.probes.readiness.type: tcp
      haproxy.probes.readiness.port: 10000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 10000
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: 10000
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet

  - it: should render tcp probes for haproxy in load balancer mode when configured
    template: load-balancer.yaml
    values:
      - ../values.yaml
    set:
      loadBalancer.enabled: true
      haproxy.enabled: true
      haproxy.mapping.logs_http_10000.from: 10000
      haproxy.mapping.logs_http_10000.to.port: 10518
      haproxy.mapping.logs_http_10000.to.protocol: "TCP"
      haproxy.probes.liveness.type: tcp
      haproxy.probes.liveness.port: 10000
      haproxy.probes.readiness.type: tcp
      haproxy.probes.readiness.port: 10000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.tcpSocket.port
          value: 10000
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.tcpSocket.port
          value: 10000
      - notExists:
          path: spec.template.spec.containers[0].readinessProbe.httpGet

  - it: should default to http healthcheck probes for haproxy in load balancer mode
    template: load-balancer.yaml
    values:
      - ../values.yaml
    set:
      loadBalancer.enabled: true
      haproxy.enabled: true
      haproxy.mapping.logs_http_10000.from: 10000
      haproxy.mapping.logs_http_10000.to.port: 10518
      haproxy.mapping.logs_http_10000.to.protocol: "TCP"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 13135
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthcheck
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 13135
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthcheck

  - it: should pin haproxy to numeric non-root user in load balancer mode
    template: load-balancer.yaml
    values:
      - ../values.yaml
    set:
      loadBalancer.enabled: true
      haproxy.enabled: true
      haproxy.mapping.logs_http_10000.from: 10000
      haproxy.mapping.logs_http_10000.to.port: 10518
      haproxy.mapping.logs_http_10000.to.protocol: "TCP"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: haproxy
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 99
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 99

  - it: should pin native sidecar haproxy to numeric non-root user in load balancer mode
    template: load-balancer.yaml
    values:
      - ../values.yaml
    set:
      loadBalancer.enabled: true
      haproxy.enabled: true
      haproxy.nativeSidecar: "true"
      haproxy.mapping.logs_http_10000.from: 10000
      haproxy.mapping.logs_http_10000.to.port: 10518
      haproxy.mapping.logs_http_10000.to.protocol: "TCP"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: haproxy
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 99
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsGroup
          value: 99

  - it: should fail template rendering on invalid haproxy probe type
    template: deployment.yaml
    values:
      - ../values.yaml
    set:
      haproxy.enabled: true
      haproxy.mapping.http_4318.from: 4318
      haproxy.mapping.http_4318.to.port: 4318
      haproxy.mapping.http_4318.to.protocol: "TCP"
      haproxy.probes.liveness.type: bogus
    asserts:
      - failedTemplate:
          errorMessage: "haproxy.probes.liveness.type must be one of [http, tcp], got \"bogus\""
