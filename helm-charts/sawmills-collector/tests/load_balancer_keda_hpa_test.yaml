suite: Load Balancer KEDA HPA Tests
templates:
  - templates/load-balancer-keda-hpa.yaml
  - templates/load-balancer-hpa.yaml
values:
  - ../values.yaml
tests:
  - it: renders external scaler trigger for load balancer KEDA scaling
    template: templates/load-balancer-keda-hpa.yaml
    release:
      name: sawmills-collector
      namespace: sample-namespace
    set:
      kedaScaler:
        enabled: true
      loadBalancer:
        enabled: true
        keda:
          enabled: true
          minReplicas: 3
          maxReplicas: 25
          scaling:
            external:
              enabled: true
            cpu:
              enabled: false
            memory:
              enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ScaledObject
      - notExists:
          path: metadata.annotations["helm.sh/revision"]
      - equal:
          path: metadata.name
          value: sawmills-collector-lb-keda-external-hpa
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - equal:
          path: spec.scaleTargetRef.name
          value: sawmills-collector-lb
      - equal:
          path: spec.minReplicaCount
          value: 3
      - equal:
          path: spec.maxReplicaCount
          value: 25
      - equal:
          path: spec.triggers[0].type
          value: external
      - equal:
          path: spec.triggers[0].metricType
          value: AverageValue
      - equal:
          path: spec.triggers[0].metadata.scalerAddress
          value: sawmills-collector-keda-otel-scaler.sample-namespace.svc.cluster.local:4418
      - equal:
          path: spec.triggers[0].metadata.query
          value: sum(otelcol_loadbalancer_central_queue_compressed_bytes)
      - equal:
          path: spec.triggers[0].metadata.targetValue
          value: "10485760"

  - it: requires keda scaler when load balancer external scaling is enabled
    template: templates/load-balancer-keda-hpa.yaml
    set:
      loadBalancer:
        enabled: true
        keda:
          enabled: true
          scaling:
            external:
              enabled: true
            cpu:
              enabled: false
            memory:
              enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'kedaScaler.enabled must be true when loadBalancer.keda.scaling.external.enabled is true'

  - it: renders metrics-api trigger for load balancer KEDA scaling
    template: templates/load-balancer-keda-hpa.yaml
    release:
      name: sawmills-collector
      namespace: sample-namespace
    set:
      kedaScaler:
        enabled: true
        service:
          monitoringPort: 19466
      loadBalancer:
        enabled: true
        keda:
          enabled: true
          scaling:
            external:
              enabled: true
              loadBalancerTriggerType: metrics-api
            cpu:
              enabled: false
            memory:
              enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: sawmills-collector-lb-keda-metrics-api-hpa
      - equal:
          path: spec.triggers[0].type
          value: metrics-api
      - equal:
          path: spec.triggers[0].useCachedMetrics
          value: true
      - notExists:
          path: spec.triggers[0].metricType
      - equal:
          path: spec.triggers[0].metadata.url
          value: http://sawmills-collector-keda-otel-scaler.sample-namespace.svc.cluster.local:19466/query?query=sum%28otelcol_loadbalancer_central_queue_compressed_bytes%29
      - equal:
          path: spec.triggers[0].metadata.format
          value: json
      - equal:
          path: spec.triggers[0].metadata.valueLocation
          value: result
      - equal:
          path: spec.triggers[0].metadata.targetValue
          value: "10485760"

  - it: can disable metrics-api caching for load balancer KEDA scaling
    template: templates/load-balancer-keda-hpa.yaml
    set:
      kedaScaler:
        enabled: true
      loadBalancer:
        enabled: true
        keda:
          enabled: true
          scaling:
            external:
              enabled: true
              loadBalancerTriggerType: metrics-api
              useCachedMetrics: false
            cpu:
              enabled: false
            memory:
              enabled: false
    asserts:
      - notExists:
          path: spec.triggers[0].useCachedMetrics

  - it: renders Prometheus trigger for load balancer KEDA scaling
    template: templates/load-balancer-keda-hpa.yaml
    release:
      name: sawmills-collector
      namespace: sample-namespace
    set:
      loadBalancer:
        enabled: true
        keda:
          enabled: true
          minReplicas: 3
          maxReplicas: 25
          scaling:
            prometheus:
              enabled: true
              metricType: Value
              metadata:
                serverAddress: http://thanos-operator-query-frontend.monitoring:9090
                query: histogram_quantile(0.999, sum(rate(http_server_duration_bucket[1m])) by (le))
                threshold: "8000"
            cpu:
              enabled: false
            memory:
              enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ScaledObject
      - equal:
          path: metadata.name
          value: sawmills-collector-lb-keda-hpa
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - equal:
          path: spec.scaleTargetRef.name
          value: sawmills-collector-lb
      - equal:
          path: spec.minReplicaCount
          value: 3
      - equal:
          path: spec.maxReplicaCount
          value: 25
      - equal:
          path: spec.triggers[0].type
          value: prometheus
      - equal:
          path: spec.triggers[0].metricType
          value: Value
      - equal:
          path: spec.triggers[0].metadata.serverAddress
          value: http://thanos-operator-query-frontend.monitoring:9090
      - equal:
          path: spec.triggers[0].metadata.query
          value: histogram_quantile(0.999, sum(rate(http_server_duration_bucket[1m])) by (le))
      - equal:
          path: spec.triggers[0].metadata.threshold
          value: "8000"

  - it: targets StatefulSet for Prometheus scaling when load balancer storage is enabled
    template: templates/load-balancer-keda-hpa.yaml
    set:
      loadBalancer:
        enabled: true
        storage:
          enabled: true
        keda:
          enabled: true
          scaling:
            prometheus:
              enabled: true
              metadata:
                serverAddress: http://thanos-operator-query-frontend.monitoring:9090
                query: histogram_quantile(0.999, sum(rate(http_server_duration_bucket[1m])) by (le))
                threshold: "8000"
            cpu:
              enabled: false
            memory:
              enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.scaleTargetRef.kind
          value: StatefulSet

  - it: requires Prometheus metadata when load balancer Prometheus scaling is enabled
    template: templates/load-balancer-keda-hpa.yaml
    set:
      loadBalancer:
        enabled: true
        keda:
          enabled: true
          scaling:
            prometheus:
              enabled: true
            cpu:
              enabled: false
            memory:
              enabled: false
    asserts:
      - failedTemplate:
          errorMessage: 'loadBalancer.keda.scaling.prometheus.metadata.serverAddress is required when loadBalancer.keda.scaling.prometheus.enabled is true'

  - it: renders false and zero Prometheus metadata values
    template: templates/load-balancer-keda-hpa.yaml
    set:
      loadBalancer:
        enabled: true
        keda:
          enabled: true
          scaling:
            prometheus:
              enabled: true
              metadata:
                serverAddress: http://thanos-operator-query-frontend.monitoring:9090
                query: histogram_quantile(0.999, sum(rate(http_server_duration_bucket[1m])) by (le))
                threshold: "8000"
                ignoreNullValues: false
                activationThreshold: 0
                emptyOptionalValue: ""
            cpu:
              enabled: false
            memory:
              enabled: false
    asserts:
      - equal:
          path: spec.triggers[0].metadata.ignoreNullValues
          value: "false"
      - equal:
          path: spec.triggers[0].metadata.activationThreshold
          value: "0"
      - notExists:
          path: spec.triggers[0].metadata.emptyOptionalValue

  - it: renders load balancer ScaledObject when autoscaling and KEDA are both enabled
    template: templates/load-balancer-keda-hpa.yaml
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        autoscaling:
          enabled: true
        keda:
          enabled: true
          scaling:
            prometheus:
              enabled: true
              metadata:
                serverAddress: http://thanos-operator-query-frontend.monitoring:9090
                query: histogram_quantile(0.999, sum(rate(http_server_duration_bucket[1m])) by (le))
                threshold: "8000"
            cpu:
              enabled: false
            memory:
              enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ScaledObject
      - equal:
          path: metadata.name
          value: sawmills-collector-lb-keda-hpa

  - it: suppresses load balancer HPA when load balancer KEDA is enabled
    template: templates/load-balancer-hpa.yaml
    set:
      loadBalancer:
        enabled: true
        autoscaling:
          enabled: true
        keda:
          enabled: true
          scaling:
            prometheus:
              enabled: true
              metadata:
                serverAddress: http://thanos-operator-query-frontend.monitoring:9090
                query: histogram_quantile(0.999, sum(rate(http_server_duration_bucket[1m])) by (le))
                threshold: "8000"
            cpu:
              enabled: false
            memory:
              enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders CPU and memory triggers with KEDA metricType syntax
    template: templates/load-balancer-keda-hpa.yaml
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        keda:
          enabled: true
          scaling:
            cpu:
              enabled: true
              targetUtilization: 65
            memory:
              enabled: true
              targetUtilization: 70
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: sawmills-collector-lb-keda-hpa
      - equal:
          path: spec.triggers[0].type
          value: cpu
      - equal:
          path: spec.triggers[0].metricType
          value: Utilization
      - notExists:
          path: spec.triggers[0].metadata.type
      - equal:
          path: spec.triggers[0].metadata.value
          value: "65"
      - equal:
          path: spec.triggers[1].type
          value: memory
      - equal:
          path: spec.triggers[1].metricType
          value: Utilization
      - notExists:
          path: spec.triggers[1].metadata.type
      - equal:
          path: spec.triggers[1].metadata.value
          value: "70"
