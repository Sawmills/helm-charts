suite: test noProxy helper
templates:
  - deployment.yaml
set:
  # sawmills-collector could include additional containers.
  # we aim to check proxy envs for the main-telemetry and telemetry-collector
  additionalContainers: {}
  haproxy.enabled: false
tests:
  # 1a. If there is neither proxy.http/https set, proxy.noProxy should remain unset
  - it: should not set NO_PROXY when proxy is not configured
    set:
      proxy: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="telemetry-collector")].env[?(@.name=="NO_PROXY")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="main-collector")].env[?(@.name=="NO_PROXY")]

  # 1b. If proxy is an empty dict, NO_PROXY should also not be set
  - it: should not set NO_PROXY when proxy is an empty dict
    set:
      proxy: {}
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="telemetry-collector")].env[?(@.name=="NO_PROXY")]
      - notExists:
          path: spec.template.spec.containers[?(@.name=="main-collector")].env[?(@.name=="NO_PROXY")]

  # 2. If proxy.http/https are not set but proxy.noProxy is set,
  #    NO_PROXY will be set to what user passed without adding MY_POD_IP
  - it: should not append MY_POD_IP when only proxy.noProxy (string) is set
    set:
      proxy:
        noProxy: "foo "
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=="telemetry-collector")].env[?(@.name=="NO_PROXY")].value
          pattern: "^foo $"
      - matchRegex:
          path: spec.template.spec.containers[?(@.name=="main-collector")].env[?(@.name=="NO_PROXY")].value
          pattern: "^foo $"

  # 3. If proxy.http is set and proxy.noProxy is unset, NO_PROXY should be static entries plus "$(MY_POD_IP)"
  - it: should set NO_PROXY to MY_POD_IP when only proxy.http is set
    set:
      proxy:
        http: URL
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="telemetry-collector")].env[?(@.name=="NO_PROXY")].value
          value: "$(KUBERNETES_SERVICE_HOST),.cluster.local,.svc,.svc.cluster.local,127.0.0.1,::1,kubernetes,kubernetes.default.svc,localhost,$(MY_POD_IP)"
      - equal:
          path: spec.template.spec.containers[?(@.name=="main-collector")].env[?(@.name=="NO_PROXY")].value
          value: "$(KUBERNETES_SERVICE_HOST),.cluster.local,.svc,.svc.cluster.local,127.0.0.1,::1,kubernetes,kubernetes.default.svc,localhost,$(MY_POD_IP)"

  # 4a. If proxy.http or proxy.https is set and proxy.noProxy is set (single string),
  #    NO_PROXY should include "<proxy.noProxy>, static entries and $(MY_POD_IP)"
  - it: should append POD_IP when proxy.https and proxy.noProxy (string) are set
    set:
      proxy:
        https: URL
        noProxy: " xxx "
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="telemetry-collector")].env[?(@.name=="NO_PROXY")].value
          value: "$(KUBERNETES_SERVICE_HOST),.cluster.local,.svc,.svc.cluster.local,127.0.0.1,::1,kubernetes,kubernetes.default.svc,localhost,xxx,$(MY_POD_IP)"
      - equal:
          path: spec.template.spec.containers[?(@.name=="main-collector")].env[?(@.name=="NO_PROXY")].value
          value: "$(KUBERNETES_SERVICE_HOST),.cluster.local,.svc,.svc.cluster.local,127.0.0.1,::1,kubernetes,kubernetes.default.svc,localhost,xxx,$(MY_POD_IP)"

  # 4b. If proxy.http or proxy.https is set and proxy.noProxy is set (multiple strings),
  #    NO_PROXY should include "<proxy.noProxy>, static entries and $(MY_POD_IP)"
  - it: should append POD_IP when proxy.https and proxy.noProxy (string) are set
    set:
      proxy:
        http: URL
        noProxy: " xxx ,  yyy,  "
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="telemetry-collector")].env[?(@.name=="NO_PROXY")].value
          value: "$(KUBERNETES_SERVICE_HOST),.cluster.local,.svc,.svc.cluster.local,127.0.0.1,::1,kubernetes,kubernetes.default.svc,localhost,xxx,yyy,$(MY_POD_IP)"
      - equal:
          path: spec.template.spec.containers[?(@.name=="main-collector")].env[?(@.name=="NO_PROXY")].value
          value: "$(KUBERNETES_SERVICE_HOST),.cluster.local,.svc,.svc.cluster.local,127.0.0.1,::1,kubernetes,kubernetes.default.svc,localhost,xxx,yyy,$(MY_POD_IP)"

  # 4c. If proxy.http or proxy.https is set and proxy.noProxy is set (multiple strings),
  #    NO_PROXY should include "<proxy.noProxy>, static entries and $(MY_POD_IP)"
  - it: should append POD_IP when proxy.https and proxy.noProxy (string) are set
    set:
      proxy:
        http: URL
        https: URL
        noProxy:
          - xxx
          - " yyy "
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="telemetry-collector")].env[?(@.name=="NO_PROXY")].value
          value: "$(KUBERNETES_SERVICE_HOST),.cluster.local,.svc,.svc.cluster.local,127.0.0.1,::1,kubernetes,kubernetes.default.svc,localhost,xxx,yyy,$(MY_POD_IP)"
      - equal:
          path: spec.template.spec.containers[?(@.name=="main-collector")].env[?(@.name=="NO_PROXY")].value
          value: "$(KUBERNETES_SERVICE_HOST),.cluster.local,.svc,.svc.cluster.local,127.0.0.1,::1,kubernetes,kubernetes.default.svc,localhost,xxx,yyy,$(MY_POD_IP)"
