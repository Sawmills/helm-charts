suite: keda scaler address namespace templating
templates:
  - templates/keda-hpa.yaml
  - templates/load-balancer-keda-hpa.yaml
  - templates/keda-scaler-service.yaml
tests:
  - it: resolves non-LB external scalerAddress from release namespace and configured port
    template: templates/keda-hpa.yaml
    release:
      name: my-release
      namespace: any-ns
    set:
      keda.enabled: true
      keda.scaling.external.enabled: true
      loadBalancer.enabled: false
      kedaScaler.service.kedaExternalScalerPort: 9444
    asserts:
      - equal:
          path: spec.triggers[0].metadata.scalerAddress
          value: my-release-keda-otel-scaler.any-ns.svc.cluster.local:9444
      - notMatchRegex:
          path: spec.triggers[0].metadata.scalerAddress
          pattern: \.sawmills\.svc\.cluster\.local

  - it: truncates long release names in scalerAddress to keep the service label valid
    template: templates/keda-hpa.yaml
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      namespace: any-ns
    set:
      keda.enabled: true
      keda.scaling.external.enabled: true
      kedaScaler.enabled: true
    asserts:
      - equal:
          path: spec.triggers[0].metadata.scalerAddress
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-keda-otel-scaler.any-ns.svc.cluster.local:4418

  - it: truncates long release names in the scaler service name
    template: templates/keda-scaler-service.yaml
    release:
      name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      namespace: any-ns
    set:
      kedaScaler.enabled: true
    asserts:
      - equal:
          path: metadata.name
          value: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa-keda-otel-scaler

  - it: resolves LB external scalerAddress without changing LB queue scaling contract
    template: templates/keda-hpa.yaml
    release:
      name: sawmills-collector
      namespace: sample-namespace
    set:
      keda.enabled: true
      keda.scaling.external.enabled: true
      loadBalancer.enabled: true
    asserts:
      - equal:
          path: spec.triggers[0].metadata.scalerAddress
          value: sawmills-collector-keda-otel-scaler.sample-namespace.svc.cluster.local:4418
      - equal:
          path: spec.triggers[0].metricType
          value: AverageValue
      - equal:
          path: spec.triggers[0].metadata.query
          value: sum(otelcol_exporter_queue_size{exporter=~"loadbalancing/collector-loadbalancer.*"})
      - equal:
          path: spec.triggers[0].metadata.targetValue
          value: "300"
      - notMatchRegex:
          path: spec.triggers[0].metadata.scalerAddress
          pattern: \.sawmills\.svc\.cluster\.local

  - it: resolves LB metrics-api URL from release namespace and monitoring port
    template: templates/keda-hpa.yaml
    release:
      name: sawmills-collector
      namespace: sample-namespace
    set:
      keda.enabled: true
      keda.scaling.external.enabled: true
      keda.scaling.external.loadBalancerTriggerType: metrics-api
      keda.scaling.external.loadBalancerMetadata.query: sum(otelcol_loadbalancer_central_queue_compressed_bytes)
      keda.scaling.external.loadBalancerMetadata.targetValue: "10485760"
      kedaScaler.enabled: true
      kedaScaler.service.monitoringPort: 19466
      loadBalancer.enabled: true
    asserts:
      - equal:
          path: spec.triggers[0].metadata.url
          value: http://sawmills-collector-keda-otel-scaler.sample-namespace.svc.cluster.local:19466/query?query=sum%28otelcol_loadbalancer_central_queue_compressed_bytes%29
      - notMatchRegex:
          path: spec.triggers[0].metadata.url
          pattern: \.sawmills\.svc\.cluster\.local

  - it: resolves loadBalancer.keda external scalerAddress from release namespace and configured port
    template: templates/load-balancer-keda-hpa.yaml
    release:
      name: sawmills-collector
      namespace: sample-namespace
    set:
      kedaScaler.enabled: true
      kedaScaler.service.kedaExternalScalerPort: 9444
      loadBalancer.enabled: true
      loadBalancer.keda.enabled: true
      loadBalancer.keda.scaling.external.enabled: true
      loadBalancer.keda.scaling.cpu.enabled: false
      loadBalancer.keda.scaling.memory.enabled: false
    asserts:
      - equal:
          path: spec.triggers[0].metadata.scalerAddress
          value: sawmills-collector-keda-otel-scaler.sample-namespace.svc.cluster.local:9444
      - notMatchRegex:
          path: spec.triggers[0].metadata.scalerAddress
          pattern: \.sawmills\.svc\.cluster\.local
