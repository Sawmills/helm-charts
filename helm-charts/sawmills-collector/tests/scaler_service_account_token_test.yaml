suite: scaler service-account token default
templates:
  - keda-scaler-deployment.yaml
tests:
  - it: When API access is not configured, then scaler Pods do not mount a token
    set:
      kedaScaler.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: When API components need cluster credentials, then the explicit token switch is honored
    set:
      kedaScaler.enabled: true
      automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
