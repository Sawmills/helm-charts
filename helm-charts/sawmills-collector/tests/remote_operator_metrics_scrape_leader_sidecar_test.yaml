suite: remote operator metrics scrape rbac and pod topology
templates:
  - deployment.yaml
  - load-balancer.yaml
  - remote-operator-scrape-leader-role.yaml
  - remote-operator-scrape-leader-rolebinding.yaml
tests:
  - it: should not render extra scrape sidecar in deployment mode
    set:
      loadBalancer:
        enabled: false
      remoteOperatorMetricsScrape:
        enabled: true
    template: deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: telemetry-collector
      - equal:
          path: spec.template.spec.containers[1].name
          value: main-collector
      - notExists:
          path: spec.template.spec.containers[2]

  - it: should not render extra scrape sidecar in load balancer mode
    set:
      loadBalancer:
        enabled: true
      remoteOperatorMetricsScrape:
        enabled: true
    template: load-balancer.yaml
    asserts:
      - notEqual:
          path: spec.template.spec.containers[0].name
          value: remote-operator-scrape-leader

  - it: should render pod-discovery role when remote operator scrape is enabled
    set:
      remoteOperatorMetricsScrape:
        enabled: true
    template: remote-operator-scrape-leader-role.yaml
    asserts:
      - equal:
          path: kind
          value: Role
      - equal:
          path: rules[0].apiGroups[0]
          value: ""
      - equal:
          path: rules[0].resources[0]
          value: pods
      - contains:
          path: rules[0].verbs
          content: list
      - contains:
          path: rules[0].verbs
          content: watch

  - it: should render pod-discovery role namespace from remote operator namespace override
    set:
      remoteOperatorMetricsScrape:
        enabled: true
        namespace: custom-remote-operator-ns
    template: remote-operator-scrape-leader-role.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: custom-remote-operator-ns

  - it: should render rolebinding for pod-discovery role
    set:
      remoteOperatorMetricsScrape:
        enabled: true
    template: remote-operator-scrape-leader-rolebinding.yaml
    asserts:
      - equal:
          path: kind
          value: RoleBinding
      - equal:
          path: roleRef.kind
          value: Role
      - equal:
          path: roleRef.name
          value: RELEASE-NAME-remote-operator-scrape
