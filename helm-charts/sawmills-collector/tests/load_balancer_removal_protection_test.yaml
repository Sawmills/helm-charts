suite: opt-in LB voluntary removal protection
templates:
  - templates/load-balancer-hpa.yaml
tests:
  - it: preserves normal HPA scale down by default
    set:
      loadBalancer.enabled: true
      loadBalancer.autoscaling.enabled: true
    asserts:
      - notExists:
          path: spec.behavior.scaleDown.selectPolicy
  - it: disables normal HPA scale down only when opted in
    set:
      loadBalancer.enabled: true
      loadBalancer.autoscaling.enabled: true
      loadBalancer.removalProtection.disableScaleDown: true
    asserts:
      - equal:
          path: spec.behavior.scaleDown.selectPolicy
          value: Disabled
      - equal:
          path: spec.behavior.scaleUp.stabilizationWindowSeconds
          value: 120
