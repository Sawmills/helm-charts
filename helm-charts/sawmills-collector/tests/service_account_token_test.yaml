suite: collector service-account token default
templates:
  - deployment.yaml
tests:
  - it: When API access is not configured, then worker Pods do not mount a token
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: When DaemonSet workers need API access, then the explicit token switch is honored
    set:
      mode: daemonSet
      automountServiceAccountToken: true
    asserts:
      - equal:
          path: kind
          value: DaemonSet
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: When API components need cluster credentials, then the explicit token switch is honored
    set:
      automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: When using DaemonSet workers, then tokens remain disabled by default
    set:
      mode: daemonSet
    asserts:
      - equal:
          path: kind
          value: DaemonSet
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
