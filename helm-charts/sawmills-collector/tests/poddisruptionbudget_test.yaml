suite: pod disruption budget
templates:
  - templates/poddisruptionbudget.yaml
capabilities:
  majorVersion: 1
  minorVersion: 27
tests:
  - it: defaults the worker PDB to five percent for a 60-replica fleet
    release:
      name: sawmills-collector
    set:
      replicaCount: 60
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%

  - it: defaults the worker PDB to five percent at the ten-replica validation floor
    release:
      name: sawmills-collector
    set:
      replicaCount: 10
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%

  - it: keeps the worker PDB default available for a three-replica fleet
    release:
      name: sawmills-collector
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%

  - it: defaults the load balancer PDB to five percent for a 60-replica fleet
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        replicas: 60
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%
        documentIndex: 1

  - it: defaults the load balancer PDB to five percent at ten replicas
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        replicas: 10
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%
        documentIndex: 1

  - it: rejects an explicit four percent worker budget across a ten to forty KEDA range
    release:
      name: sawmills-collector
    set:
      keda:
        enabled: true
        minReplicas: 10
        maxReplicas: 40
      podDisruptionBudget:
        maxUnavailable: 4%
    asserts:
      - failedTemplate:
          errorMessage: 'worker PDB maxUnavailable 4% allows 1 disruptions at scale 21, below required 2'

  - it: rejects an explicit four percent load balancer budget across a ten to forty KEDA range
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        keda:
          enabled: true
          minReplicas: 10
          maxReplicas: 40
        podDisruptionBudget:
          maxUnavailable: 4%
    asserts:
      - failedTemplate:
          errorMessage: 'load balancer PDB maxUnavailable 4% allows 1 disruptions at scale 21, below required 2'

  - it: rejects an explicit four percent worker budget across a ten to forty HPA range
    release:
      name: sawmills-collector
    set:
      autoscaling:
        enabled: true
        minReplicas: 10
        maxReplicas: 40
      podDisruptionBudget:
        maxUnavailable: 4%
    asserts:
      - failedTemplate:
          errorMessage: 'worker PDB maxUnavailable 4% allows 1 disruptions at scale 21, below required 2'

  - it: rejects a four percent worker budget when the range starts inside a breakpoint block
    release:
      name: sawmills-collector
    set:
      replicaCount: 22
      podDisruptionBudget:
        maxUnavailable: 4%
    asserts:
      - failedTemplate:
          errorMessage: 'worker PDB maxUnavailable 4% allows 1 disruptions at scale 22, below required 2'

  - it: rejects a zero percent worker budget for a mid-block static fleet
    release:
      name: sawmills-collector
    set:
      replicaCount: 15
      podDisruptionBudget:
        maxUnavailable: 0%
    asserts:
      - failedTemplate:
          errorMessage: 'worker PDB maxUnavailable 0% allows 0 disruptions at scale 15, below required 1'

  - it: rejects a zero worker budget at the ten-replica floor
    release:
      name: sawmills-collector
    set:
      autoscaling:
        enabled: true
        minReplicas: 10
        maxReplicas: 40
      podDisruptionBudget:
        maxUnavailable: 0
    asserts:
      - failedTemplate:
          errorMessage: 'worker PDB maxUnavailable 0 allows 0 disruptions at scale 40, below required 2'

  - it: rejects a restrictive percentage minAvailable at the ten-replica floor
    release:
      name: sawmills-collector
    set:
      keda:
        enabled: true
        minReplicas: 10
        maxReplicas: 40
      podDisruptionBudget:
        minAvailable: 95%
    asserts:
      - failedTemplate:
          errorMessage: 'worker PDB minAvailable 95% allows 0 disruptions at scale 10, below required 1'

  - it: keeps larger explicit budgets valid without adding an upper cap
    release:
      name: sawmills-collector
    set:
      keda:
        enabled: true
        minReplicas: 10
        maxReplicas: 40
      podDisruptionBudget:
        maxUnavailable: 100%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 100%

  - it: sets the voluntary disruption budget for a large static collector fleet
    release:
      name: sawmills-collector
    set:
      replicaCount: 80
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: 5%
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow

  - it: permits one disruption for a single-replica collector
    release:
      name: sawmills-collector
    set:
      replicaCount: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%

  - it: sets the disruption budget when keda autoscales the collector
    release:
      name: sawmills-collector
    set:
      keda:
        enabled: true
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%
      - notExists:
          path: spec.minAvailable

  - it: sets the disruption budget when native HPA autoscales the collector
    release:
      name: sawmills-collector
    set:
      autoscaling:
        enabled: true
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%
      - notExists:
          path: spec.minAvailable

  - it: lets explicit minAvailable win over all maxUnavailable settings
    release:
      name: sawmills-collector
    set:
      keda:
        enabled: true
      podDisruptionBudget:
        minAvailable: 9
        maxUnavailable: 2
        autoscaledMaxUnavailable: 5%
    asserts:
      - equal:
          path: spec.minAvailable
          value: 9
      - notExists:
          path: spec.maxUnavailable

  - it: honors explicit maxUnavailable
    release:
      name: sawmills-collector
    set:
      podDisruptionBudget:
        maxUnavailable: 2
        autoscaledMaxUnavailable: 5%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 2

  - it: honors the deprecated autoscaled percentage alias
    release:
      name: sawmills-collector
    set:
      keda:
        enabled: true
      podDisruptionBudget:
        autoscaledMaxUnavailable: 5%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%

  - it: ignores the deprecated autoscaled alias for a static collector
    release:
      name: sawmills-collector
    set:
      replicaCount: 80
      podDisruptionBudget:
        autoscaledMaxUnavailable: 10%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%

  - it: uses the five percent default when availability settings are blank
    release:
      name: sawmills-collector
    set:
      podDisruptionBudget:
        minAvailable: " "
        maxUnavailable: ""
        autoscaledMaxUnavailable: ""
    asserts:
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.maxUnavailable
          value: 5%

  - it: sets the LB disruption budget when LB keda is enabled
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        keda:
          enabled: true
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.maxUnavailable
          value: 5%
        documentIndex: 1
      - notExists:
          path: spec.minAvailable
        documentIndex: 1
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow
        documentIndex: 1

  - it: sets the disruption budget for a large static LB fleet
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        replicas: 80
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: spec.maxUnavailable
          value: 5%
        documentIndex: 1

  - it: sets the LB disruption budget when native HPA is enabled
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        autoscaling:
          enabled: true
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%
        documentIndex: 1

  - it: lets explicit LB minAvailable win over maxUnavailable
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        podDisruptionBudget:
          minAvailable: 75
          maxUnavailable: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 75
        documentIndex: 1
      - notExists:
          path: spec.maxUnavailable
        documentIndex: 1

  - it: honors explicit LB maxUnavailable over the compatibility alias
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        podDisruptionBudget:
          maxUnavailable: 2
          autoscaledMaxUnavailable: 5%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 2
        documentIndex: 1

  - it: honors the deprecated LB autoscaled percentage alias
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        keda:
          enabled: true
        podDisruptionBudget:
          autoscaledMaxUnavailable: 5%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%
        documentIndex: 1

  - it: ignores the deprecated autoscaled alias for a static LB
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
        replicas: 80
        podDisruptionBudget:
          autoscaledMaxUnavailable: 10%
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 5%
        documentIndex: 1

  - it: omits unhealthy pod eviction policy before Kubernetes 1.27
    capabilities:
      majorVersion: 1
      minorVersion: 26
    release:
      name: sawmills-collector
    set:
      loadBalancer:
        enabled: true
    asserts:
      - notExists:
          path: spec.unhealthyPodEvictionPolicy
        documentIndex: 0
      - notExists:
          path: spec.unhealthyPodEvictionPolicy
        documentIndex: 1
