suite: Main HPA Tests
templates:
  - templates/hpa.yaml
values:
  - ../values.yaml
tests:
  - it: renders the standard HPA when autoscaling is enabled and KEDA is disabled
    set:
      autoscaling:
        enabled: true
      keda:
        enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: HorizontalPodAutoscaler
      - equal:
          path: spec.scaleTargetRef.name
          value: RELEASE-NAME

  - it: renders absolute CPU average value target when configured
    set:
      autoscaling:
        enabled: true
        targetCPUUtilizationPercentage: 0
        targetMemoryUtilizationPercentage: 0
        targetCPUAverageValue: 400m
      keda:
        enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.type
          value: AverageValue
      - equal:
          path: spec.metrics[0].resource.target.averageValue
          value: 400m

  - it: does not render the standard HPA when KEDA is enabled
    set:
      autoscaling:
        enabled: true
      keda:
        enabled: true
    asserts:
      - hasDocuments:
          count: 0
