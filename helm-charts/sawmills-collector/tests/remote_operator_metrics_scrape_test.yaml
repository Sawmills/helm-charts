suite: remote operator metrics scrape wiring
templates:
  - telemetry-configmap.yaml
  - load-balancer-telemetry-configmap.yaml
tests:
  - it: should not render remote operator scrape receiver by default
    set:
      loadBalancer:
        enabled: true
    template: load-balancer-telemetry-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'prometheus/remote_operator:'
      - notMatchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'metrics/remote_operator:'

  - it: should render remote operator pod discovery in LB telemetry config when enabled
    set:
      loadBalancer:
        enabled: true
      remoteOperatorMetricsScrape:
        enabled: true
    template: load-balancer-telemetry-configmap.yaml
    asserts:
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'prometheus/remote_operator:'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'metrics/remote_operator:'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'job_name: remote-operator'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'kubernetes_sd_configs:'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'role: pod'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: '__meta_kubernetes_pod_label_app_kubernetes_io_name'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'target_label: remote_operator_pod'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'target_label: remote_operator_namespace'
      - notMatchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'http_sd_configs:'
      - notMatchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'svc\.cluster\.local'

  - it: should not duplicate remote operator scrape in deployment telemetry config when LB mode is on
    set:
      loadBalancer:
        enabled: true
      remoteOperatorMetricsScrape:
        enabled: true
    template: telemetry-configmap.yaml
    asserts:
      - notMatchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'prometheus/remote_operator:'

  - it: should render remote operator pod discovery in deployment telemetry config with overrides
    set:
      loadBalancer:
        enabled: false
      remoteOperatorMetricsScrape:
        enabled: true
        namespace: custom-ns
        port: 9090
        scrapeInterval: 30s
        podLabelSelectors:
          app.kubernetes.io/name: custom-ro
    template: telemetry-configmap.yaml
    asserts:
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'prometheus/remote_operator:'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'role: pod'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: '- custom-ns'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'scrape_interval: 30s'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: '__meta_kubernetes_pod_container_port_number'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'regex: "9090"'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: '__meta_kubernetes_pod_label_app_kubernetes_io_name'
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: 'regex: custom-ro'
