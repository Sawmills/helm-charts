suite: observer dedicated API access
templates:
  - worker-cpu-observer.yaml
values:
  - values/worker_cpu_observer.yaml
tests:
  - it: When collector tokens are disabled, then the opt-in observer keeps its dedicated API account
    set:
      automountServiceAccountToken: false
      keda.enabled: true
      workerCPUObserver.enabled: true
      workerCPUObserver.image: example.invalid/checker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      collectorId: synthetic-collector
      collectorName: production-synthetic
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true
        documentIndex: 0
      - matchRegex:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          pattern: cpu-observer$
        documentIndex: 3
      - notExists:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
        documentIndex: 3
