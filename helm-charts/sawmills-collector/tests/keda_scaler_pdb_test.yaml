suite: keda scaler pod disruption budget
templates:
  - templates/keda-scaler-pdb.yaml
tests:
  - it: protects the single-replica scaler by default
    release:
      name: sawmills-collector
    set:
      kedaScaler.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: sawmills-collector-keda-otel-scaler
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: sawmills-collector-keda-otel-scaler

  - it: renders nothing when the scaler is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: can be opted out
    set:
      kedaScaler:
        enabled: true
        podDisruptionBudget:
          enabled: false
    asserts:
      - hasDocuments:
          count: 0
