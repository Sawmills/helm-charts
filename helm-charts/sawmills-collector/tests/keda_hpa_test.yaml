suite: KEDA HPA Tests
templates:
  - templates/keda-hpa.yaml
values:
  - ../values.yaml
tests:
  - it: renders LB external queue scaler with AverageValue
    set:
      loadBalancer:
        enabled: true
      keda:
        enabled: true
        scaling:
          external:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ScaledObject
      - equal:
          path: spec.scaleTargetRef.kind
          value: Deployment
      - equal:
          path: spec.triggers[0].type
          value: external
      - equal:
          path: spec.triggers[0].metadata.scalerAddress
          value: RELEASE-NAME-keda-otel-scaler.NAMESPACE.svc.cluster.local:4418
      - equal:
          path: spec.triggers[0].metricType
          value: AverageValue
      - equal:
          path: spec.triggers[0].metadata.query
          value: sum(otelcol_exporter_queue_size{exporter=~"loadbalancing/collector-loadbalancer.*"})
      - equal:
          path: spec.triggers[0].metadata.targetValue
          value: "300"
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.stabilizationWindowSeconds
          value: 0
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.selectPolicy
          value: Max
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.policies[0].type
          value: Percent
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.policies[0].value
          value: 100
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.policies[0].periodSeconds
          value: 60
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.policies[1].type
          value: Pods
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.policies[1].value
          value: 20
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleUp.policies[1].periodSeconds
          value: 60
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.stabilizationWindowSeconds
          value: 300
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.selectPolicy
          value: Min
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.policies[0].type
          value: Percent
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.policies[0].value
          value: 10
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.policies[0].periodSeconds
          value: 60
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.policies[1].type
          value: Pods
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.policies[1].value
          value: 5
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.behavior.scaleDown.policies[1].periodSeconds
          value: 60

  - it: renders LB metrics-api queue scaler with AverageValue
    release:
      name: sawmills-collector
      namespace: sample-namespace
    set:
      loadBalancer:
        enabled: true
      kedaScaler:
        enabled: true
      keda:
        enabled: true
        scaling:
          external:
            enabled: true
            loadBalancerTriggerType: metrics-api
            loadBalancerMetadata:
              query: sum(otelcol_loadbalancer_central_queue_compressed_bytes)
              targetValue: "10485760"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ScaledObject
      - equal:
          path: spec.triggers[0].type
          value: metrics-api
      - equal:
          path: spec.triggers[0].metricType
          value: AverageValue
      - equal:
          path: spec.triggers[0].metadata.format
          value: json
      - equal:
          path: spec.triggers[0].metadata.valueLocation
          value: result
      - equal:
          path: spec.triggers[0].metadata.targetValue
          value: "10485760"
      - equal:
          path: spec.triggers[0].metadata.url
          value: http://sawmills-collector-keda-otel-scaler.sample-namespace.svc.cluster.local:19465/query?query=sum%28otelcol_loadbalancer_central_queue_compressed_bytes%29
      - notExists:
          path: spec.triggers[0].metadata.scalerAddress

  - it: renders fallback replicas for metrics-api scaler failures
    release:
      name: sawmills-collector
      namespace: sample-namespace
    set:
      loadBalancer:
        enabled: true
      kedaScaler:
        enabled: true
      keda:
        enabled: true
        fallback:
          enabled: true
          failureThreshold: 3
          replicas: 10
        scaling:
          external:
            enabled: true
            loadBalancerTriggerType: metrics-api
            loadBalancerMetadata:
              query: sum(otelcol_loadbalancer_central_queue_compressed_bytes)
              targetValue: "10485760"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.fallback.failureThreshold
          value: 3
      - equal:
          path: spec.fallback.replicas
          value: 10

  - it: requires keda scaler when rendering LB metrics-api queue scaler
    set:
      loadBalancer:
        enabled: true
      keda:
        enabled: true
        scaling:
          external:
            enabled: true
            loadBalancerTriggerType: metrics-api
    asserts:
      - failedTemplate:
          errorMessage: 'kedaScaler.enabled must be true when keda.scaling.external.loadBalancerTriggerType is metrics-api'

  - it: renders KEDA HPA ownership transfer settings
    set:
      loadBalancer:
        enabled: true
      keda:
        enabled: true
        annotations:
          scaledobject.keda.sh/transfer-hpa-ownership: "true"
        advanced:
          horizontalPodAutoscalerConfig:
            name: sawmills-collector
        scaling:
          external:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["scaledobject.keda.sh/transfer-hpa-ownership"]
          value: "true"
      - equal:
          path: spec.advanced.horizontalPodAutoscalerConfig.name
          value: sawmills-collector
      - equal:
          path: spec.triggers[0].metricType
          value: AverageValue

  - it: keeps non-LB external latency scaler on Value
    set:
      loadBalancer:
        enabled: false
      keda:
        enabled: true
        scaling:
          external:
            enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.triggers[0].type
          value: external
      - equal:
          path: spec.triggers[0].metricType
          value: Value
      - matchRegex:
          path: spec.triggers[0].metadata.query
          pattern: vector\(5000\)
      - equal:
          path: spec.triggers[0].metadata.targetValue
          value: "5000"

  - it: renders CPU and memory triggers with KEDA metricType syntax
    set:
      keda:
        enabled: true
        scaling:
          prometheus:
            enabled: false
          external:
            enabled: false
          cpu:
            enabled: true
            targetUtilization: 70
          memory:
            enabled: true
            targetUtilization: 75
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: spec.triggers[0].type
          value: cpu
      - equal:
          path: spec.triggers[0].metricType
          value: Utilization
      - notExists:
          path: spec.triggers[0].metadata.type
      - equal:
          path: spec.triggers[0].metadata.value
          value: "70"
      - equal:
          path: spec.triggers[1].type
          value: memory
      - equal:
          path: spec.triggers[1].metricType
          value: Utilization
      - notExists:
          path: spec.triggers[1].metadata.type
      - equal:
          path: spec.triggers[1].metadata.value
          value: "75"
