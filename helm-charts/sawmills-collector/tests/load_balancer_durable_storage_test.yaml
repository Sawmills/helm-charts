suite: Load Balancer Durable Storage Ownership
capabilities:
  majorVersion: 1
  minorVersion: 35
templates:
  - templates/load-balancer.yaml
  - templates/load-balancer-telemetry-configmap.yaml
values:
  - ../values.yaml
release:
  name: durable-proof
  namespace: saw-13194-lb-drain
tests:
  - it: preserves the original claims for a durable ordinal
    set:
      loadBalancer.enabled: true
      loadBalancer.storage.enabled: true
      loadBalancer.storage.className: encrypted-gp3-1b
      loadBalancer.autoscaling.enabled: false
      loadBalancer.keda.enabled: false
    template: templates/load-balancer.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - notExists:
          path: spec.serviceName
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy
          value:
            whenDeleted: Retain
            whenScaled: Retain
      - equal:
          path: spec.volumeClaimTemplates[0].spec.storageClassName
          value: encrypted-gp3-1b
      - equal:
          path: spec.volumeClaimTemplates[0].spec.accessModes
          value: [ReadWriteOnce]
      - equal:
          path: spec.template.spec.securityContext.fsGroup
          value: 10001

  - it: preserves legacy service identity with a custom resource base name
    set:
      resourceBaseName: durable-custom
      loadBalancer.enabled: true
      loadBalancer.storage.enabled: true
    template: templates/load-balancer.yaml
    asserts:
      - notExists:
          path: spec.serviceName
      - equal:
          path: metadata.name
          value: durable-custom-lb

  - it: leaves memory-only load balancers as deployments
    set:
      loadBalancer.enabled: true
      loadBalancer.storage.enabled: false
    template: templates/load-balancer.yaml
    asserts:
      - isKind:
          of: Deployment
      - notExists:
          path: spec.serviceName
      - notExists:
          path: spec.persistentVolumeClaimRetentionPolicy
      - notExists:
          path: spec.volumeClaimTemplates

  - it: retains legacy claims without unsupported fields on Kubernetes 1.22
    capabilities:
      majorVersion: 1
      minorVersion: 22
    set:
      loadBalancer.enabled: true
      loadBalancer.storage.enabled: true
    template: templates/load-balancer.yaml
    asserts:
      - isKind:
          of: StatefulSet
      - notExists:
          path: spec.persistentVolumeClaimRetentionPolicy
      - notExists:
          path: spec.serviceName

  - it: preserves durable ownership and failure telemetry in the remote-write filter
    template: templates/load-balancer-telemetry-configmap.yaml
    set:
      loadBalancer.enabled: true
    asserts:
      - matchRegex:
          path: data["telemetry-config.yaml"]
          pattern: '(?ms)filter/lb_remote_write:.*storage_failures.*durable_pending_items.*durable_pending_bytes.*durable_oldest_enqueued_time.*durable_terminal_rejected_items.*durable_deferred_items'
