suite: keda scaler deployment
templates:
  - templates/keda-scaler-deployment.yaml
tests:
  - it: probes the query endpoint for liveness
    set:
      kedaScaler.enabled: true
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 19465
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /query?query=up
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.timeoutSeconds
          value: 2
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: 13134
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /healthcheck
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.failureThreshold
          value: 3
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.timeoutSeconds
          value: 1

  - it: keeps the scaler fixed at one replica
    set:
      kedaScaler:
        enabled: true
        replicaCount: 2
    asserts:
      - equal:
          path: spec.replicas
          value: 1

  - it: shields the scaler pod from karpenter disruption by default
    set:
      kedaScaler.enabled: true
    asserts:
      - equal:
          path: spec.template.metadata.annotations["karpenter.sh/do-not-disrupt"]
          value: "true"

  - it: omits the disruption shield when opted out
    set:
      kedaScaler:
        enabled: true
        doNotDisrupt: false
    asserts:
      - notExists:
          path: spec.template.metadata.annotations

  - it: keeps user pod annotations alongside the disruption shield
    set:
      kedaScaler.enabled: true
      podAnnotations:
        example.com/team: platform
    asserts:
      - equal:
          path: spec.template.metadata.annotations["karpenter.sh/do-not-disrupt"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["example.com/team"]
          value: platform
