suite: load-balancer service-account token default
templates:
  - load-balancer.yaml
tests:
  - it: When API access is not configured, then load-balancer Pods do not mount a token
    set:
      loadBalancer.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: When EndpointSlice discovery needs API access, then missing token opt-in is rejected
    set:
      loadBalancer.enabled: true
      loadBalancer.membershipDiscovery.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: loadBalancer.membershipDiscovery requires automountServiceAccountToken=true

  - it: When API components need cluster credentials, then the explicit token switch is honored
    set:
      loadBalancer.enabled: true
      automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true

  - it: When using DNS-only membership, then no API token is needed
    set:
      loadBalancer.enabled: true
      loadBalancer.dnsMembership.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: When opting into EndpointSlice discovery, then the load balancer has a token
    set:
      loadBalancer.enabled: true
      loadBalancer.membershipDiscovery.enabled: true
      automountServiceAccountToken: true
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: true
