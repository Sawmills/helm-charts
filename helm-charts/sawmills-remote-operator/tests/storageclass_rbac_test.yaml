suite: storage class discovery permissions
templates:
  - storageclass-rbac.yaml
set:
  rbac.storageClassDiscovery.enabled: true
tests:
  - it: grants exactly get and list on StorageClasses at cluster scope
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: rules
          value:
            - apiGroups: [storage.k8s.io]
              resources: [storageclasses]
              verbs: [get, list]
        documentIndex: 0
      - notExists:
          path: metadata.namespace
        documentIndex: 0
  - it: binds only the configured service account in the release namespace
    release:
      name: operator
      namespace: logging
    set:
      rbac.serviceAccountName: existing-operator
    asserts:
      - isKind:
          of: ClusterRoleBinding
        documentIndex: 1
      - equal:
          path: metadata.name
          value: logging.operator-storageclasses
        documentIndex: 0
      - equal:
          path: metadata.name
          value: logging.operator-storageclasses
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: existing-operator
              namespace: logging
        documentIndex: 1
      - equal:
          path: roleRef
          value:
            kind: ClusterRole
            name: logging.operator-storageclasses
            apiGroup: rbac.authorization.k8s.io
        documentIndex: 1
      - notExists:
          path: metadata.namespace
        documentIndex: 1
  - it: creates no cluster objects when storage discovery is disabled
    set:
      rbac.storageClassDiscovery.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: supports an existing namespace role and binding independently
    set:
      rbac.createRole: false
      rbac.createRoleBinding: false
    asserts:
      - hasDocuments:
          count: 2
  - it: separates hyphenated namespace and release names without collisions
    release:
      name: a-op
      namespace: team
    asserts:
      - equal:
          path: metadata.name
          value: team.a-op-storageclasses
        documentIndex: 0
      - notEqual:
          path: metadata.name
          value: team-a.op-storageclasses
        documentIndex: 0
      - isKind:
          of: ClusterRole
        documentIndex: 0
  - it: refuses a binding without a service account
    set:
      rbac.serviceAccountName: ""
    asserts:
      - failedTemplate:
          errorMessage: rbac.serviceAccountName is required for storage class discovery
