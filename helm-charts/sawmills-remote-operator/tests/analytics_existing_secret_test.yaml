suite: analytics existing secret
templates:
  - deployment.yaml
tests:
  - it: should not include analytics secret in MANAGED_CHARTS_VALUES by default
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="MANAGED_CHARTS_VALUES")].value
          pattern: 'analyticsExistingSecret'
      - notMatchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="MANAGED_CHARTS_VALUES")].value
          pattern: 'sawmills-analytics-secret'

  - it: should inject analytics secret into MANAGED_CHARTS_VALUES when set
    set:
      analyticsExistingSecret: sawmills-analytics-secret
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="MANAGED_CHARTS_VALUES")].value
          pattern: 'sawmills-analytics-secret'

  - it: should use custom secret key when analyticsExistingSecretKey is overridden
    set:
      analyticsExistingSecret: my-custom-secret
      analyticsExistingSecretKey: custom-key
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="MANAGED_CHARTS_VALUES")].value
          pattern: 'my-custom-secret'
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="MANAGED_CHARTS_VALUES")].value
          pattern: 'custom-key'

  - it: should preserve existing metricsClickhouseRouting settings when merging
    set:
      analyticsExistingSecret: sawmills-analytics-secret
      managedChartsValues:
        sawmills-collector:
          metricsClickhouseRouting:
            enabled: true
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="MANAGED_CHARTS_VALUES")].value
          pattern: 'sawmills-analytics-secret'
      - matchRegex:
          path: spec.template.spec.containers[0].env[?(@.name=="MANAGED_CHARTS_VALUES")].value
          pattern: '"enabled":true'
