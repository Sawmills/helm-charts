suite: analytics existing secret values
templates:
  - deployment.yaml
tests:
  - it: should have analyticsExistingSecret default to empty string
    asserts:
      - isKind:
          of: Deployment

  - it: should include analyticsExistingSecret in MANAGED_CHARTS_VALUES when set
    set:
      analyticsExistingSecret: sawmills-analytics-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MANAGED_CHARTS_VALUES
          any: true
