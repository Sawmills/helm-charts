{{- $name := printf "%s-%s-storageclasses" .Release.Namespace .Release.Name }}
{{- if .Values.rbac.createRole }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "sawmills-remote-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
{{- end }}
{{- if .Values.rbac.createRoleBinding }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "sawmills-remote-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ required "rbac.serviceAccountName is required for storage class discovery" .Values.rbac.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
