suite: deployment contract
templates:
  - deployment.yaml
tests:
  - it: always emits LEVEL even when using the chart-managed secret
    set:
      apiKey: aaaa
      collectorName: sawmills-collector
      logLevel: debug
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEVEL
            value: debug
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="API_KEY")].valueFrom.secretKeyRef.name
          value: remote-operator

  - it: uses an existing secret without dropping LEVEL
    set:
      apiKeyExistingSecret: existing
      collectorName: sawmills-collector
      logLevel: warn
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: LEVEL
            value: warn
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="API_KEY")].valueFrom.secretKeyRef.name
          value: existing

  - it: wires service account and security context from values
    set:
      apiKey: aaaa
      collectorName: sawmills-collector
      rbac:
        createServiceAccount: true
        createRole: true
        createRoleBinding: true
        serviceAccountName: custom-operator-sa
        roleName: custom-role
        roleBindingName: custom-rolebinding
      securityContext:
        runAsNonRoot: false
        runAsUser: 20001
        runAsGroup: 20002
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: true
        seccompProfile:
          type: Localhost
        capabilities:
          drop:
            - NET_RAW
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-operator-sa
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 20001
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsGroup
          value: 20002
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.seccompProfile.type
          value: Localhost
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop[0]
          value: NET_RAW

  - it: fails when collectorName is empty
    set:
      apiKey: aaaa
      collectorName: ""
    asserts:
      - failedTemplate:
          errorMessage: collectorName must be set
