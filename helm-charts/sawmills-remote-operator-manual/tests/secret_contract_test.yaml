suite: secret contract
templates:
  - secret.yaml
tests:
  - it: fails when no existing secret is provided and apiKey is empty
    asserts:
      - failedTemplate:
          errorMessage: apiKey must be set when apiKeyExistingSecret is empty

  - it: renders the chart-managed secret when apiKey is provided
    set:
      apiKey: aaaa
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: data.api-key
          value: YWFhYQ==

  - it: skips the chart-managed secret when using an existing secret
    set:
      apiKeyExistingSecret: existing
    asserts:
      - hasDocuments:
          count: 0
