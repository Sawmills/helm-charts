{{- if .Values.rbac.createRole }}
{{- if not .Values.rbac.roleName }}
{{- fail "roleName must be set when createRole is true" }}
{{- end }}
{{- include "sawmills-remote-operator.failIfManualAutoscalerConfigured" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: sawmills-operator
  name: {{ .Values.rbac.roleName }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete, get, patch, update]
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
{{- end }}
