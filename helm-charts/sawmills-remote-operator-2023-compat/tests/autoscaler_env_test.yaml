suite: autoscaler env wiring
templates:
  - deployment.yaml
tests:
  - it: should not emit autoscaler env vars by default
    set:
      autoscaler:
        enabled: false
        dryRun: null
        metricsEndpoint: null
        otlpMetricsEndpoint: null
        targetHPAName: null
        leaseName: null
        labelSelectors: null
        memoryLimitBytes: null
        globalMinReplicas: null
        globalMaxReplicas: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_ENABLED")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_DRY_RUN")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_METRICS_ENDPOINT")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_METRICS_ENDPOINT")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_TARGET_HPA_NAME")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_LEASE_NAME")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_LABEL_SELECTORS")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_MEMORY_LIMIT_BYTES")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_GLOBAL_MIN_REPLICAS")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_GLOBAL_MAX_REPLICAS")]

  - it: should render all autoscaler env vars when values are explicitly set
    set:
      autoscaler:
        enabled: true
        dryRun: false
        metricsEndpoint: http://sawmills-collector:19465/metrics
        otlpMetricsEndpoint: http://sawmills-collector:14319/v1/metrics
        targetHPAName: sawmills-collector-lb
        leaseName: sawmills-operator-autoscaler-leader
        labelSelectors:
          exporter: ~.*loadbalancing/collector-loadbalancer.*
        memoryLimitBytes: 2147483648
        globalMinReplicas: 3
        globalMaxReplicas: 50
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_ENABLED")].value
          value: "true"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_DRY_RUN")].value
          value: "false"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_METRICS_ENDPOINT")].value
          value: "http://sawmills-collector:19465/metrics"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_METRICS_ENDPOINT")].value
          value: "http://sawmills-collector:14319/v1/metrics"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_TARGET_HPA_NAME")].value
          value: "sawmills-collector-lb"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_LEASE_NAME")].value
          value: "sawmills-operator-autoscaler-leader"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_LABEL_SELECTORS")].value
          value: "{\"exporter\":\"~.*loadbalancing/collector-loadbalancer.*\"}"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_MEMORY_LIMIT_BYTES")].value
          value: "2147483648"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_GLOBAL_MIN_REPLICAS")].value
          value: "3"
      - equal:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_GLOBAL_MAX_REPLICAS")].value
          value: "50"

  - it: should not emit autoscaler overrides when enabled is false
    set:
      autoscaler:
        enabled: false
        dryRun: false
        metricsEndpoint: http://sawmills-collector:19465/metrics
        otlpMetricsEndpoint: http://sawmills-collector:14319/v1/metrics
        targetHPAName: sawmills-collector-lb
        leaseName: sawmills-operator-autoscaler-leader
        labelSelectors:
          exporter: ~.*loadbalancing/collector-loadbalancer.*
        memoryLimitBytes: 2147483648
        globalMinReplicas: 3
        globalMaxReplicas: 50
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_ENABLED")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_DRY_RUN")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_METRICS_ENDPOINT")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="OTEL_EXPORTER_OTLP_METRICS_ENDPOINT")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_TARGET_HPA_NAME")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_LEASE_NAME")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_LABEL_SELECTORS")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_MEMORY_LIMIT_BYTES")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_GLOBAL_MIN_REPLICAS")]
      - notExists:
          path: spec.template.spec.containers[0].env[?(@.name=="AUTOSCALER_GLOBAL_MAX_REPLICAS")]

  - it: should fail when autoscaler global min is greater than global max
    set:
      autoscaler:
        enabled: true
        globalMinReplicas: 10
        globalMaxReplicas: 3
    asserts:
      - failedTemplate:
          errorMessage: "autoscaler.globalMinReplicas cannot be greater than autoscaler.globalMaxReplicas when autoscaler.enabled=true"
